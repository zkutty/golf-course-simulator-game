          export async function inspectComplete(root,appRoot,target,driver){
            validateBounds(root,Object.keys(artifactLimits),true);const json=name=>JSON.parse(readFileSync(resolve(root,name),'utf8'));
            const identity=json('source/identity.json');assert.equal(target,'eebb5a388a153078046021a64aa897a3886bc9f4');assert.equal(identity.targetCommit,target);assert.equal(identity.driverCommit,driver);assert.notEqual(target,driver);assert.equal(resolve(identity.targetRoot,'simgolf-lite'),resolve(appRoot));for(const key of ['GITHUB_SHA','VITE_COMMIT_SHA','ZK682_EXPECTED_COMMIT'])assert.equal(identity.aliases[key],target);
