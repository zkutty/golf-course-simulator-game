            target/simgolf-lite/artifacts/current-capture-phase-eebb/run/late-finalization-hold.json
            target/simgolf-lite/artifacts/current-capture-phase-eebb/smoke/late-finalization-hold.json
          if-no-files-found: error
          retention-days: 30
      - name: Retire only owned generated inodes after observed closure
        if: always()
        shell: bash
        working-directory: target/simgolf-lite
        env:
          P_RUN_CONCLUSION: ${{ steps.current_capture_run.conclusion }}
          P_SMOKE_CONCLUSION: ${{ steps.current_capture_smoke.conclusion }}
        run: |
          # BEGIN CURRENT CAPTURE RETIRE
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';import {resolve} from 'node:path';
          const workflow=readFileSync(resolve(process.env.GITHUB_WORKSPACE,'.github/workflows/zk682-certification.yml'),'utf8'),text=workflow.split('# BEGIN CURRENT CAPTURE CONTROLLER\n')[1].split('# END CURRENT CAPTURE CONTROLLER')[0],code=text.split("node --input-type=module <<'NODE'\n")[1].split('\n          NODE')[0].split('\n').map(line=>line.slice(10)).join('\n');process.env.ZK682_CURRENT_CAPTURE_CONTROLLER_TEST='1';const c=await import('data:text/javascript,'+encodeURIComponent(code));
          const provenanceFile=resolve(c.namespace,'source/generated-provenance.json');c.verifyOwned(provenanceFile,{dev:Number(process.env.P_PROVENANCE_DEV),ino:Number(process.env.P_PROVENANCE_INO),bytes:c.regular(provenanceFile).size,sha256:process.env.P_PROVENANCE_SHA});const provenance=c.jsonFile(provenanceFile);
          if(process.env.P_SMOKE_CONCLUSION!=='skipped')c.observedClosure(c.jsonFile(resolve(c.namespace,'smoke/owned-command-receipt.json')));
          const launched=process.env.P_RUN_CONCLUSION!=='skipped';const receipt=launched?c.jsonFile(resolve(c.namespace,'run/owned-command-receipt.json')):null;c.retireGenerated(process.cwd(),provenance.generated,receipt);
          NODE
          # END CURRENT CAPTURE RETIRE
      - name: Require valid current diagnostic disposition without canonical credit
        if: always()
        working-directory: target/simgolf-lite
        env:
          CURRENT_CAPTURE_DIAGNOSTIC_READY: ${{ steps.current_capture_artifact_bounds.outputs.diagnostic_ready }}
        run: test "$CURRENT_CAPTURE_DIAGNOSTIC_READY" = "true"
