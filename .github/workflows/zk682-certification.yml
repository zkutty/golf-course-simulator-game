          export function boundedArtifact(root,name){assert.ok(Object.hasOwn(artifactLimits,name),'Unknown artifact name');const file=resolve(root,name);assert.ok(!lstatSync(root).isSymbolicLink(),'Root symlink refused');const stat=lstatSync(file,{throwIfNoEntry:false});if(!stat)return 0;assert.ok(!stat.isSymbolicLink()&&stat.isFile(),'Artifact ownership refused');assert.ok(stat.size<=artifactLimits[name],'Artifact bound exceeded');return stat.size;}
