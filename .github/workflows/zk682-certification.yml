            const targetStatus=git(targetRoot,'status','--porcelain','--untracked-files=all');for(const row of targetStatus?targetStatus.split('\n'):[]){assert.ok(row.startsWith('?? '),'tracked target drift');if(!postSettlement)assert.ok(allowed.has(row.slice(3)),'unowned target dirt '+row);}
