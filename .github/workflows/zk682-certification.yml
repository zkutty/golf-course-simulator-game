          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {readFileSync,writeFileSync,mkdirSync,lstatSync} from 'node:fs';
          import {resolve,dirname} from 'node:path';import {createHash} from 'node:crypto';
          export const baseline='ab8f4e2cde4d54666db6406ca5aeee598d207768';
          export const baseDriver='d7fc6efb1ca5a191b7e35a951eee3b3d896c2ea8';
          export const sourcePaths=['src','public','package.json','package-lock.json','vite.config.ts','scripts/pixi-reset-patch.json','scripts/perf-smoke.mjs','e2e/zk682-resource-growth.e2e.ts','scripts/react-component-timing-cleanup.mjs','scripts/zk682-resource-growth-contract.mjs','scripts/zk682-public-canvas-capture.mjs'];
