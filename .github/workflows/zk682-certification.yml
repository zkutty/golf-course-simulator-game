5aa2092503116cf00f831d4c21d425f60db6b8b75cc24fac449ede5b591a4","scripts/zk682-certification-contract.test.mjs":"9d0fa57d16b887a77ea27ba67b5f1d6cc1a07c55b12ba2a0ca17eaf43cbc7ce8"};
