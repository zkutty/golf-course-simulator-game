          export function stage(appRoot,path,source){assert.ok(generatedPaths.includes(path)||[namespace+'/source/identity.json',namespace+'/source/generated-provenance.json'].includes(path),'fixed generated destination required');const file=resolve(appRoot,path);mkdirSync(dirname(file),{recursive:true});assert.equal(realpathSync(dirname(file)),dirname(file));let descriptor;try{descriptor=openSync(file,'wx',0o600);writeFileSync(descriptor,source);}finally{if(descriptor!==undefined)closeSync(descriptor);}const stat=regular(file),bytes=readFileSync(file);assert.equal(bytes.toString('utf8'),source);return {path,dev:stat.dev,ino:stat.ino,bytes:bytes.length,sha256:hash(bytes)};}
