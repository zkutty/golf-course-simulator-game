            const resource=json('run/renderer-resource-growth.json');const numerical=await import(pathToFileURL(resolve(appRoot,'scripts/zk682-resource-growth-contract.mjs')).href);assert.deepEqual(resource,numerical.createZk682ResourceGrowthReport({...resource,thresholds:numerical.ZK682_RESOURCE_GROWTH_THRESHOLDS}));assert.equal(resource.passed,true);
