          export function boundedArtifact(root,name,requiredFile=false){assert.ok(Object.hasOwn(artifactLimits,name),'unknown artifact');const file=resolve(root,name),stat=lstatSync(file,{throwIfNoEntry:false});if(!stat){assert.ok(!requiredFile,'missing artifact '+name);return 0;}assert.ok(stat.isFile()&&!stat.isSymbolicLink(),'artifact symlink/nonfile refused');assert.equal(realpathSync(file),file,'ancestor symlink refused');assert.ok(stat.size<=artifactLimits[name],'artifact bound exceeded');return stat.size;}
          export function validateBounds(root,names=Object.keys(artifactLimits),requireComplete=false){assert.equal(new Set(names).size,names.length,'duplicate artifact');assert.equal(realpathSync(root),resolve(root),'root symlink refused');assert.ok(lstatSync(root).isDirectory()&&!lstatSync(root).isSymbolicLink());let total=0,logs=0;for(const name of names){const size=boundedArtifact(root,name,requireComplete&&required.includes(name));total+=size;if(name.endsWith('.log'))logs+=size;}
            const walk=(dir,prefix='')=>{for(const entry of readdirSync(dir,{withFileTypes:true})){const name=prefix+entry.name,file=resolve(dir,entry.name),stat=lstatSync(file);assert.ok(!stat.isSymbolicLink(),'symlink refused');if(stat.isDirectory()){assert.ok(['run','source','smoke'].includes(name),'unknown directory');walk(file,name+'/');}else{assert.ok(stat.isFile()&&names.includes(name),'unknown artifact path '+name);}}};walk(resolve(root));assert.ok(logs<=262144,'combined logs bound exceeded');assert.ok(total<=1048576,'upload total bound exceeded');return total;
          }
          export function verifyInventory(owned,root){assert.ok(Array.isArray(owned.artifacts));const seen=new Set();for(const row of owned.artifacts){assert.ok(typeof row.path==='string'&&!seen.has(row.path),'duplicate/invalid inventory path');seen.add(row.path);const name='run/'+row.path;assert.ok(Object.hasOwn(artifactLimits,name),'unknown inventory path');boundedArtifact(root,name,true);const bytes=readFileSync(resolve(root,name));assert.equal(row.bytes,bytes.length);assert.equal(row.sha256,hash(bytes));}for(const name of required.filter(n=>n.startsWith('run/')&&n!=='run/owned-command-receipt.json'))assert.ok(seen.has(name.slice(4)),'missing owned inventory '+name);}
          export async function inspectComplete(root,appRoot,target,driver){
