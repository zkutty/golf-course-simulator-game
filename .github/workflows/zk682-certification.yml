            const identity=json('source/identity.json');assert.equal(target,'4a27e748957925ac476e98e9aaeed4e6a70f095f');assert.equal(identity.targetCommit,target);assert.equal(identity.driverCommit,driver);assert.notEqual(target,driver);assert.equal(resolve(identity.targetRoot,'simgolf-lite'),resolve(appRoot));for(const key of ['GITHUB_SHA','VITE_COMMIT_SHA','ZK682_EXPECTED_COMMIT'])assert.equal(identity.aliases[key],target);
            assert.deepEqual(identity.sourceHashes.map(row=>[row.path,row.sha256]),Object.entries(expectedTargetPins));for(const row of identity.sourceHashes){assert.equal(hash(readFileSync(resolve(appRoot,row.path))),row.sha256,'current target source mismatch');}
            assert.equal(identity.supervisor.path,resolve(identity.driverRoot,'simgolf-lite/scripts/linux-diagnostic-supervisor.py'));assert.equal(identity.supervisor.sha256,'7fa51db57c8c377262a16a712203721c5c53ba71344f2b53268350a9f76020d7');assert.equal(hash(readFileSync(identity.supervisor.path)),identity.supervisor.sha256);
            const owned=json('run/owned-command-receipt.json'),smoke=json('smoke/owned-command-receipt.json');for(const receipt of [owned,smoke]){assert.equal(receipt.passed,true);assert.equal(receipt.exitCode,0);assert.equal(receipt.cause,null);assert.equal(receipt.closureVerified,true);assert.equal(receipt.childReaped,true);assert.deepEqual(receipt.ownedStillObserved,[]);assert.deepEqual(receipt.ownedZombiesStillObserved,[]);}
            assert.equal(owned.workerSeconds,1850);assert.equal(owned.parentSeconds,1910);assert.deepEqual(owned.command,['node','scripts/zk682-run-resource-growth.mjs','--expected-commit',target]);verifyInventory(owned,root);
            assert.match(readFileSync(resolve(root,'source/discovery.log'),'utf8'),/^Total: 1 test in 1 file$/m);
            const resource=json('run/renderer-resource-growth.json');const numerical=await import(pathToFileURL(resolve(appRoot,'scripts/zk682-resource-growth-contract.mjs')).href);assert.deepEqual(resource,numerical.createZk682ResourceGrowthReport({...resource,thresholds:numerical.ZK682_RESOURCE_GROWTH_THRESHOLDS}));assert.equal(resource.passed,true);
            const contract=await import(pathToFileURL(resolve(appRoot,'scripts/zk682-certification-contract.mjs')).href);const result=contract.inspectZk682RendererCompleteness({candidateCommit:target,resource,cleanup:json('run/zk682-react-component-timing-cleanup.json'),capture:json('run/zk682-canvas-capture-receipt.json'),commandReceipt:json('run/renderer-resource-growth-command.json'),png:readFileSync(resolve(root,'run/zk682-resource-growth-final.png'))});assert.equal(result.valid,true,result.errors.join('; '));return {complete:true,targetCommit:target,driverCommit:driver,pixelChecks:'target completeness contract decoded bounded nonuniform visible PNG; root scene visual QA still required'};
