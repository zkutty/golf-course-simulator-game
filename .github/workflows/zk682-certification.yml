name: ZK-682 exact-SHA certification

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character commit SHA to certify
        required: true
        type: string

      verification_mode:
        description: Original app heap diagnostic or unchanged full certification
        required: false
        default: full
        type: choice
        options:
          - full
          - original-app-heap-5c236

permissions:
  contents: read

defaults:
  run:
    working-directory: simgolf-lite

jobs:
  linux-evidence:
    if: ${{ inputs.verification_mode != 'original-app-heap-5c236' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      ZK682_EXPECTED_COMMIT: ${{ inputs.candidate_sha }}
      VITE_COMMIT_SHA: ${{ inputs.candidate_sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
      - name: Verify exact candidate checkout
        shell: bash
        run: |
          [[ "$ZK682_EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$ZK682_EXPECTED_COMMIT"
          git cat-file -e "${ZK682_EXPECTED_COMMIT}^{commit}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: simgolf-lite/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Production build receipt
        run: >-
          node scripts/zk682-run-command-receipt.mjs
          --id core-build
          --output artifacts/zk682/raw/core-build.json
          --candidate "$ZK682_EXPECTED_COMMIT"
          -- npm run build
      - name: Headless performance receipt
        env:
          PERF_FIXTURE_READY_TIMEOUT_MS: "300000"
          PERF_FIXTURE: m27
          PERF_THEME: parkland
        run: >-
          node scripts/zk682-run-command-receipt.mjs
          --id headless-performance
          --output artifacts/zk682/raw/headless-performance-command.json
          --candidate "$ZK682_EXPECTED_COMMIT"
          -- npm run test:perf
      - name: Unit suite receipt
        run: >-
          node scripts/zk682-run-command-receipt.mjs
          --id core-unit
          --output artifacts/zk682/raw/core-unit.json
          --candidate "$ZK682_EXPECTED_COMMIT"
          -- npm run test:ci
      - name: Deterministic soak receipt
        run: >-
          node scripts/zk682-run-command-receipt.mjs
          --id core-determinism
          --output artifacts/zk682/raw/core-determinism.json
          --candidate "$ZK682_EXPECTED_COMMIT"
          -- npm run test:soak
      - name: Reducer fuzz receipt
        run: >-
          node scripts/zk682-run-command-receipt.mjs
          --id core-reducer
          --output artifacts/zk682/raw/core-reducer.json
          --candidate "$ZK682_EXPECTED_COMMIT"
          -- npm run test:fuzz
      - name: Save and migration receipt
        run: >-
          node scripts/zk682-run-command-receipt.mjs
          --id core-save
          --output artifacts/zk682/raw/core-save.json
          --candidate "$ZK682_EXPECTED_COMMIT"
          -- npx vitest run
          src/utils/save.test.ts
          src/utils/saveStore.test.ts
          src/game/live/persistence.test.ts
          src/game/rules/roundSnapshotMigration.test.ts
          --maxWorkers=1
          --testTimeout=60000
      - name: PlatformServices receipt
        run: >-
          node scripts/zk682-run-command-receipt.mjs
          --id core-platform-services
          --output artifacts/zk682/raw/core-platform-services.json
          --candidate "$ZK682_EXPECTED_COMMIT"
          -- npx vitest run src/platform/platform.test.ts --maxWorkers=1
      - name: Supported-browser receipt
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >-
          node scripts/zk682-run-command-receipt.mjs
          --id browser-supported
          --output artifacts/zk682/raw/browser-supported.json
          --candidate "$ZK682_EXPECTED_COMMIT"
          -- bash -lc
          'npm run test:release:browsers -- --grep-invert "ZK-813" --project=chrome-stable --project=webkit-safari-proxy --workers=1 &&
          xvfb-run --auto-servernum npm run test:release:browsers -- --grep-invert "ZK-813" --project=firefox --workers=1 --headed'
      - name: Golden browser receipt
        run: >-
          node scripts/zk682-run-command-receipt.mjs
          --id browser-golden
          --output artifacts/zk682/raw/browser-golden.json
          --candidate "$ZK682_EXPECTED_COMMIT"
          -- npm run test:e2e:golden -- --workers=1 --retries=0
      - name: Offline PWA receipt and typed evidence
        run: >-
          node scripts/zk682-run-command-receipt.mjs
          --id browser-pwa
          --output artifacts/zk682/raw/browser-pwa.json
          --candidate "$ZK682_EXPECTED_COMMIT"
          -- npm run test:pwa:certification -- --expected-commit "$ZK682_EXPECTED_COMMIT"
      - name: Asset package audit receipt
        run: >-
          node scripts/zk682-run-command-receipt.mjs
          --id asset-package-audit
          --output artifacts/zk682/raw/asset-package-audit.json
          --candidate "$ZK682_EXPECTED_COMMIT"
          -- npm run audit:m35-assets
      - name: Unselected-biome isolation receipt
        run: >-
          node scripts/zk682-run-command-receipt.mjs
          --id asset-unselected-biomes
          --output artifacts/zk682/raw/asset-unselected-biomes.json
          --candidate "$ZK682_EXPECTED_COMMIT"
          -- npm run test:e2e -- e2e/zk674-biome-zoom-cache.e2e.ts --workers=1 --retries=0
      - name: Collect typed Linux build and performance evidence
        run: node scripts/zk682-collect-linux-evidence.mjs
      - name: Collect renderer resource-growth evidence
        continue-on-error: true
        run: npm run test:resource-growth -- --expected-commit "$ZK682_EXPECTED_COMMIT"
      - name: Collect supplemental stability evidence
        continue-on-error: true
        run: npm run test:stability -- --expected-commit "$ZK682_EXPECTED_COMMIT"
      - name: Upload exact-candidate Linux evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zk682-linux-evidence-${{ inputs.candidate_sha }}
          path: simgolf-lite/artifacts/zk682/raw
          if-no-files-found: error
          retention-days: 90

  native-evidence:
    if: ${{ inputs.verification_mode != 'original-app-heap-5c236' }}
    name: ${{ matrix.platform }}-${{ matrix.architecture }} native evidence
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      ZK682_EXPECTED_COMMIT: ${{ inputs.candidate_sha }}
      COMMIT_SHA: ${{ inputs.candidate_sha }}
      ZK682_EXPECTED_PLATFORM: ${{ matrix.platform }}
      ZK682_EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin
            architecture: arm64
          - os: windows-2022
            platform: win32
            architecture: x64
    steps:
      - name: Disable Windows checkout newline conversion
        if: runner.os == 'Windows'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
      - name: Verify exact candidate checkout
        shell: bash
        run: |
          [[ "$ZK682_EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$ZK682_EXPECTED_COMMIT"
          git cat-file -e "${ZK682_EXPECTED_COMMIT}^{commit}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: simgolf-lite/package-lock.json
      - run: npm ci
      - run: npm run test:desktop
      - run: npm run build
      - name: Package unsigned exact-candidate application
        run: npm run desktop:pack:dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Run candidate-bound persistence and recovery certification
        continue-on-error: true
        run: npm run desktop:package:persistence
      - name: Upload exact-candidate native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zk682-native-evidence-${{ matrix.platform }}-${{ matrix.architecture }}-${{ inputs.candidate_sha }}
          path: simgolf-lite/artifacts/zk682/raw/desktop-${{ matrix.platform }}-${{ matrix.architecture }}
          if-no-files-found: error
          retention-days: 90
      - name: Upload approved unsigned package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coursecraft-${{ matrix.platform }}-${{ matrix.architecture }}-unsigned-${{ inputs.candidate_sha }}
          path: simgolf-lite/desktop-dist
          if-no-files-found: error
          retention-days: 30

  aggregate:
    if: ${{ inputs.verification_mode != 'original-app-heap-5c236' }}
    needs: [linux-evidence, native-evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ZK682_EXPECTED_COMMIT: ${{ inputs.candidate_sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
      - name: Verify exact candidate checkout
        shell: bash
        run: |
          [[ "$ZK682_EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$ZK682_EXPECTED_COMMIT"
          git cat-file -e "${ZK682_EXPECTED_COMMIT}^{commit}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: simgolf-lite/package-lock.json
      - run: npm ci
      - name: Download exact Linux evidence from this run
        uses: actions/download-artifact@v4
        with:
          name: zk682-linux-evidence-${{ inputs.candidate_sha }}
          path: simgolf-lite/artifacts/zk682/raw
      - name: Download exact macOS evidence from this run
        uses: actions/download-artifact@v4
        with:
          name: zk682-native-evidence-darwin-arm64-${{ inputs.candidate_sha }}
          path: simgolf-lite/artifacts/zk682/raw/desktop-darwin-arm64
      - name: Download exact Windows evidence from this run
        uses: actions/download-artifact@v4
        with:
          name: zk682-native-evidence-win32-x64-${{ inputs.candidate_sha }}
          path: simgolf-lite/artifacts/zk682/raw/desktop-win32-x64
      - name: Build exact-candidate certification packet
        id: build-packet
        continue-on-error: true
        run: >-
          npm run release:build:zk682 --
          --candidate "$ZK682_EXPECTED_COMMIT"
          --evidence-root artifacts/zk682/raw
      - name: Retain raw and normalized packet on GO, HOLD, or invalid evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zk682-certification-packet-${{ inputs.candidate_sha }}
          path: |
            simgolf-lite/artifacts/zk682/raw
            simgolf-lite/release/zk682
          if-no-files-found: error
          retention-days: 90
      - name: Require passing machine gates and physical-only blockers
        if: always()
        env:
          ZK682_PACKET_BUILD_OUTCOME: ${{ steps.build-packet.outcome }}
        run: |
          test "$ZK682_PACKET_BUILD_OUTCOME" = "success"
          node scripts/zk682-workflow-verdict.mjs \
            --report release/zk682/certification-report.json \
            --expected-commit "$ZK682_EXPECTED_COMMIT"

  original-app-heap:
    if: ${{ inputs.verification_mode == 'original-app-heap-5c236' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      HEAP_DRIVER_SHA: ${{ github.sha }}
      HEAP_DRIVER_ROOT: ${{ github.workspace }}/heap-driver
      HEAP_TARGET_ROOT: ${{ github.workspace }}/heap-target
      ZK682_EXPECTED_COMMIT: ${{ inputs.candidate_sha }}
      VITE_COMMIT_SHA: ${{ inputs.candidate_sha }}
    steps:
      - name: Checkout immutable diagnostic driver
        timeout-minutes: 5
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: heap-driver
          fetch-depth: 1
      - name: Checkout unchanged exact target
        timeout-minutes: 5
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          path: heap-target
          fetch-depth: 1
      - name: Verify roles and source pins; create exclusive intent
        id: source_before
        working-directory: ${{ github.workspace }}
        shell: bash
        timeout-minutes: 5
        env:
          HEAP_PIN_PHASE: before
        run: |
          export GITHUB_SHA="$ZK682_EXPECTED_COMMIT"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, select, stat, subprocess, time
          TARGET = "5c236f38655ed9e74d24530f402e08601dbe9387"
          PINS = {'simgolf-lite/package.json': {'bytes': 11208, 'sha256': '6bdbf6af0dca94b79d3025f73b4558ed555b243e03c2ef0ef8c6f42530cdf951'}, 'simgolf-lite/playwright.config.ts': {'bytes': 697, 'sha256': '35d7a3e1c5bf4c00508ff1cfd2510a2bc1306c3243eacac924a9b0940327a948'}, 'simgolf-lite/e2e/zk682-resource-growth.e2e.ts': {'bytes': 15221, 'sha256': 'cd238c429bb3c4745b903124442409ad1309e5f6a368ddbf81cd376c2f907142'}, 'simgolf-lite/e2e/zk682-stability.e2e.ts': {'bytes': 17333, 'sha256': 'c45b0cf36a725fbe4da0de4877cdac016e29c334f63f1a3b674edfb20bdd2a45'}, 'simgolf-lite/scripts/zk682-run-resource-growth.mjs': {'bytes': 2105, 'sha256': '49206a32a5d47386e4695098cf53b06812d1f352745752dd7fd2be7ecedf48a2'}, 'simgolf-lite/scripts/zk682-run-stability.mjs': {'bytes': 1790, 'sha256': '43587e0f25cba83c3fe0f16884a91e291cf7bce7e813bd5c9a9805e038393647'}}
          def require(value, message):
              if not value: raise RuntimeError(message)
          def directory(name):
              p = pathlib.Path(os.environ[name])
              require(p.is_absolute() and str(p.resolve()) == str(p), "checkout alias refused")
              require(stat.S_ISDIR(p.lstat().st_mode), "checkout directory required")
              return p
          def git(p, *args):
              return subprocess.check_output(["git", "-C", str(p), *args], text=True, timeout=10).strip()
          def regular_pin(p):
              require(str(p.resolve()) == str(p), "source alias refused")
              before = p.lstat()
              require(stat.S_ISREG(before.st_mode), "regular source required")
              fd = os.open(p, os.O_RDONLY | os.O_NOFOLLOW)
              try:
                  opened = os.fstat(fd)
                  require((opened.st_dev, opened.st_ino, opened.st_size) == (before.st_dev, before.st_ino, before.st_size), "source identity drift")
                  b = b""
                  while True:
                      chunk = os.read(fd, 65536)
                      if not chunk: break
                      b += chunk
                      require(len(b) <= 65536, "source size cap")
                  after = os.fstat(fd)
              finally: os.close(fd)
              current = p.lstat()
              identity = lambda s: (s.st_dev, s.st_ino, s.st_size, s.st_mtime_ns, s.st_ctime_ns)
              require(identity(before) == identity(after) == identity(current), "source changed while hashing")
              return {"bytes": len(b), "sha256": hashlib.sha256(b).hexdigest()}
          driver, target = directory("HEAP_DRIVER_ROOT"), directory("HEAP_TARGET_ROOT")
          expected_driver = os.environ["HEAP_DRIVER_SHA"]
          phase = os.environ.get("HEAP_PIN_PHASE", "before")
          require(phase in ("before", "after"), "source phase invalid")
          run_id, attempt = os.environ["GITHUB_RUN_ID"], os.environ["GITHUB_RUN_ATTEMPT"]
          require(run_id.isascii() and run_id.isdigit() and 0 < int(run_id) <= 9007199254740991 and attempt == "1", "run identity/cap invalid")
          raw = target / "simgolf-lite/artifacts/zk682/raw"
          for parent in (raw, *raw.parents):
              if parent.exists() or parent.is_symlink():
                  require(str(parent.resolve()) == str(parent) and stat.S_ISDIR(parent.lstat().st_mode), "raw parent alias refused")
              if parent == target: break
          raw.mkdir(parents=True, exist_ok=True)
          require(str(raw.resolve()) == str(raw) and stat.S_ISDIR(raw.lstat().st_mode), "raw root alias refused")
          # The trusted output root is established before fallible source guards.
          first_error, actual, driver_head, target_head, roles_passed = None, None, "UNKNOWN", "UNKNOWN", False
          try:
              require(len(expected_driver) == 40 and all(c in "0123456789abcdef" for c in expected_driver), "driver SHA invalid")
              require(expected_driver != TARGET and os.environ["ZK682_EXPECTED_COMMIT"] == TARGET, "source/target roles invalid")
              require(os.environ["GITHUB_SHA"] == TARGET and os.environ["VITE_COMMIT_SHA"] == TARGET, "child target binding invalid")
              driver_head = git(driver, "rev-parse", "HEAD")
              require(driver != target and driver_head == expected_driver, "driver checkout drift")
              target_head = git(target, "rev-parse", "HEAD")
              require(target_head == TARGET, "target checkout drift")
              roles_passed = True
              subprocess.check_call(["git", "-C", str(target), "diff", "--quiet", "HEAD", "--"], timeout=10)
              subprocess.check_call(["git", "-C", str(target), "diff", "--cached", "--quiet", "HEAD", "--"], timeout=10)
              actual = {name: regular_pin(target / name) for name in PINS}
              require(actual == PINS, "target source pin drift")
          except Exception as error:
              first_error = error
          def error_record(error):
              message = str(error)
              return {"type": type(error).__name__, "message": message[:512], "messageTruncated": len(message) > 512}
          def status_output(*args):
              p = subprocess.Popen(["git", "-C", str(target), "diff", "--name-status", "--no-renames", "-z", *args],
                                   stdin=subprocess.DEVNULL, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL)
              data, deadline = bytearray(), time.monotonic() + 10
              try:
                  while True:
                      remaining = deadline - time.monotonic()
                      require(remaining > 0 and select.select([p.stdout], [], [], remaining)[0], "status deadline")
                      chunk = os.read(p.stdout.fileno(), min(4096, 32769 - len(data)))
                      if not chunk: break
                      data.extend(chunk)
                      require(len(data) <= 32768, "status output cap")
                  require(p.wait(timeout=max(0, deadline - time.monotonic())) == 0, "status git failure")
                  return bytes(data)
              finally:
                  p.stdout.close()
                  if p.poll() is None: p.kill(); p.wait(timeout=10)
          def changed_pin(name):
              p = target / name
              require(str(p.resolve()) == str(p), "changed source alias refused")
              before = p.lstat()
              require(stat.S_ISREG(before.st_mode) and before.st_nlink == 1, "changed regular single-link source required")
              require(before.st_size <= 65536, "changed source size cap")
              fd = os.open(p, os.O_RDONLY | os.O_NOFOLLOW)
              identity = lambda s: (s.st_dev, s.st_ino, s.st_size, s.st_mtime_ns, s.st_ctime_ns, s.st_nlink)
              digest, size = hashlib.sha256(), 0
              try:
                  require(identity(os.fstat(fd)) == identity(before), "changed source identity drift")
                  while True:
                      chunk = os.read(fd, 65536)
                      if not chunk: break
                      size += len(chunk)
                      require(size <= 65536, "changed source size cap")
                      digest.update(chunk)
                  after = os.fstat(fd)
              finally: os.close(fd)
              require(str(p.resolve()) == str(p) and identity(before) == identity(after) == identity(p.lstat()), "changed source changed while hashing")
              return {"bytes": size, "sha256": digest.hexdigest()}
          changed, status_error, seen_views = {}, None, set()
          try:
              for view, args in (("worktreeVsIndex", ("--",)), ("indexVsHead", ("--cached", "HEAD", "--"))):
                  data = status_output(*args)
                  require(not data or data.endswith(b"\0"), "status termination UNKNOWN")
                  fields = data.split(b"\0")[:-1] if data else []
                  require(len(fields) % 2 == 0, "status pairing UNKNOWN")
                  for offset in range(0, len(fields), 2):
                      status = fields[offset].decode("ascii")
                      name = fields[offset + 1].decode("utf-8")
                      require(status in ("A", "D", "M", "T", "U", "X", "B"), "status code UNKNOWN")
                      parts = name.split("/")
                      require(name and len(fields[offset + 1]) <= 1024 and all(part not in ("", ".", "..") for part in parts)
                              and not name.startswith("/"), "status path UNKNOWN")
                      require((view, name) not in seen_views, "duplicate status UNKNOWN")
                      seen_views.add((view, name))
                      if name not in changed:
                          require(len(changed) < 128, "changed path cap")
                          changed[name] = {"path": name, "changes": [], "hashOutcome": "UNKNOWN"}
                      changed[name]["changes"].append({"view": view, "status": status})
              for name, row in changed.items():
                  try:
                      row["file"] = changed_pin(name); row["hashOutcome"] = "COMPLETE"
                  except Exception as error:
                      row["hashError"] = error_record(error)
                      if status_error is None: status_error = error
          except Exception as error:
              status_error = error
          if first_error is None and status_error is not None: first_error = status_error
          if first_error is None and changed: first_error = RuntimeError("tracked status drift")
          qualified = first_error is None and status_error is None and not changed
          source_sha = expected_driver if len(expected_driver) == 40 and all(c in "0123456789abcdef" for c in expected_driver) else "UNKNOWN"
          status_report = {"schemaVersion": 1, "purpose": "neutral-source-status", "sourceSha": source_sha, "candidateSha": TARGET,
                           "runId": int(run_id), "runAttempt": 1, "phase": phase, "sourceQualified": qualified,
                           "outcome": "PASS" if qualified else ("HOLD" if status_error is not None else "FAIL"),
                           "rolesAndHeadsPassed": roles_passed,
                           "driverHead": driver_head if len(driver_head) == 40 and all(c in "0123456789abcdef" for c in driver_head) else "UNKNOWN",
                           "targetHead": target_head if len(target_head) == 40 and all(c in "0123456789abcdef" for c in target_head) else "UNKNOWN",
                           "pinsPassed": actual == PINS, "firstFailure": error_record(first_error) if first_error is not None else None,
                           "statusFailure": error_record(status_error) if status_error is not None else None,
                           "historyComplete": status_error is None, "metadataOverflow": False,
                           "changedPaths": list(changed.values()), "collectedChangedPaths": len(changed), "omittedChangedPaths": 0}
          status_data = (json.dumps(status_report, separators=(",", ":")) + "\n").encode()
          if len(status_data) > 32768:
              cap_error = RuntimeError("source status metadata cap")
              if first_error is None: first_error = cap_error
              qualified = False
              status_report.update(outcome="HOLD", sourceQualified=False, historyComplete=False, metadataOverflow=True,
                                   changedPaths=[], omittedChangedPaths=len(changed), statusFailure=error_record(cap_error),
                                   firstFailure=error_record(first_error))
              status_data = (json.dumps(status_report, separators=(",", ":")) + "\n").encode()
          require(len(status_data) <= 32768, "source status fallback cap")
          context = {"schemaVersion": 1, "purpose": "original-app-heap-verification", "sourceSha": expected_driver, "candidateSha": TARGET,
                     "runId": int(run_id), "runAttempt": 1, "workflowPath": ".github/workflows/zk682-certification.yml", "phase": phase,
                     "sourcePins": actual, "linuxEffectiveTestMs": 1800000, "linuxGlobalTimeout": None,
                     "workerSeconds": 1920, "killGraceSeconds": 60, "hardEnvelopeSeconds": 1980,
                     "originalLocalBudgetsUnchanged": [595, 600, 660], "captureMsUnchanged": 10000,
                     "processClosure": "UNKNOWN; GNU timeout process-group policy is not PID reconciliation"}
          def wx(name, obj):
              data = (json.dumps(obj, indent=2) + "\n").encode()
              require(len(data) <= 65536, "context cap")
              with open(raw / name, "xb") as f: f.write(data); f.flush(); os.fsync(f.fileno())
          try:
              with open(raw / ("heap-source-status-" + phase + ".json"), "xb") as f:
                  f.write(status_data); f.flush(); os.fsync(f.fileno())
              if first_error is None:
                  if phase == "before":
                      wx("heap-hosted-intent.json", {"purpose": context["purpose"], "sourceSha": expected_driver, "candidateSha": TARGET,
