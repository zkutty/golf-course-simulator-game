          require(not output.exists() and not output.is_symlink(), "inventory output already exists")
          root_before = raw.lstat()
          files = []
          for p in raw.rglob("*"):
              s = p.lstat()
              require(not stat.S_ISLNK(s.st_mode), "raw symlink refused")
              require(stat.S_ISDIR(s.st_mode) or stat.S_ISREG(s.st_mode), "raw special file refused")
              if stat.S_ISDIR(s.st_mode): continue
              require(len(files) < 127, "raw file count exceeds 128 including inventory")
              require(p.suffix.lower() != ".json" or s.st_size <= 1048576, "individual JSON cap exceeded")
              files.append((p, s))
          require(sum(s.st_size for _, s in files) <= 1073676288, "raw aggregate cap including 64KiB inventory reserve exceeded")
          rows = []
          identity = lambda s: (s.st_dev, s.st_ino, s.st_size, s.st_mtime_ns, s.st_ctime_ns)
          for p, before in sorted(files):
              fd = os.open(p, os.O_RDONLY | os.O_NOFOLLOW)
              try:
                  require(identity(os.fstat(fd)) == identity(before), "raw identity drift")
                  digest, size = hashlib.sha256(), 0
                  while True:
                      b = os.read(fd, 1048576)
                      if not b: break
                      size += len(b); require(size <= before.st_size, "raw size drift"); digest.update(b)
                  after = os.fstat(fd)
              finally: os.close(fd)
              require(identity(before) == identity(after) == identity(p.lstat()) and size == before.st_size, "raw changed while hashing")
              rows.append({"path": p.relative_to(raw).as_posix(), "bytes": size, "sha256": digest.hexdigest()})
          require(identity(root_before) == identity(raw.lstat()), "raw membership changed while hashing")
          result = {"schemaVersion": 1, "sourceSha": os.environ["HEAP_DRIVER_SHA"], "candidateSha": os.environ["ZK682_EXPECTED_COMMIT"],
                    "runId": int(os.environ["GITHUB_RUN_ID"]), "runAttempt": 1, "entries": rows, "fileCountIncludingInventory": len(rows) + 1,
                    "rawBytesExcludingInventory": sum(r["bytes"] for r in rows), "rawCapBytes": 1073741824, "jsonCapBytes": 1048576,
                    "resourceOutcome": os.environ.get("HEAP_RESOURCE_OUTCOME") or "UNKNOWN",
                    "stabilityOutcome": os.environ.get("HEAP_STABILITY_OUTCOME") or "UNKNOWN",
                    "postSourceOutcome": os.environ.get("HEAP_POST_SOURCE_OUTCOME") or "UNKNOWN",
                    "processClosure": "UNKNOWN; no universal native/descendant closure proved", "certificationEligible": False}
          data = (json.dumps(result, indent=2) + "\n").encode()
          require(len(data) <= 65536 and sum(r["bytes"] for r in rows) + len(data) <= 1073741824, "inventory output cap")
          with open(output, "xb") as f: f.write(data); f.flush(); os.fsync(f.fileno())
