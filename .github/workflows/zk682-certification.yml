          export const appPin='e1549f13dc82b9901d9ca23442dbd1ed5bdea285a463e9a1e26c0c3cbc01aa71';
          export const targetPins={"e2e/zk682-resource-growth.e2e.ts":"69cf83d45ab294d018e142b15834353105aaf456875f2320a0bce4d7fdc057f7","scripts/zk682-run-resource-growth.mjs":"49206a32a5d47386e4695098cf53b06812d1f352745752dd7fd2be7ecedf48a2","scripts/zk682-command-receipt.mjs":"edad908429a7d7c9d5528ddc216287ba9aa3a6063eb1a49adcd2e10e7a1201dc","scripts/react-component-timing-cleanup.mjs":"f61a7d4218c736b0fff536a0f875a69dfa82edb56c5d2993c3d4bc56273760c2","scripts/zk682-public-canvas-capture.mjs":"6fef03d6a061172e7eb9d8da3c5a096c4448d26eb62794ad4984be1bad53a7eb","scripts/zk682-resource-growth-contract.mjs":"9c9ad1d355bfe724c567c39e79abc370c256d36d101a4398e53f9dc21b99df27","scripts/zk682-certification-contract.mjs":"d714d4441931cec4d311daa091dc9d727669edc8294bef631b65f092b7a31f46","scripts/pwa-save-evidence.mjs":"78c3abb256bc5dddaff40a46d93a63fe44480df5a071eb0d78f085e80d891c1f","scripts/zk682-desktop-persistence-contract.mjs":"1f2ce5291bf95d381dda16eeb6dcd98c56fc711065d447789f380ffedcff7830","scripts/zk682-stability-contract.mjs":"16f4a1006eb9a7dcbe576ec0e2e7c4c6a73db49e8d8b91161c7ebed48b6a10b7","scripts/zk682-resource-growth-recording-policy.test.mjs":"0e7cda6ae7dcfdb111d2a9c44ada27712af4d91470062a780e45670c7420c66e","package.json":"fb50a3ac5421a40fdedd3e89da7d37869c077d1ec99628af2e5a0eeb0e21adf1","package-lock.json":"0866f32e72d93d3eb2112f4b3a07f3f6366429c8575a47ef12a6083f7506e391","playwright.config.ts":"35d7a3e1c5bf4c00508ff1cfd2510a2bc1306c3243eacac924a9b0940327a948","vite.config.ts":"330d2088255a3135f7647786be86257a68b6d7668b643fc57da8898b913125d8","scripts/pixi-reset-patch.json":"9108c41ddfe74f3f774ead25f0dcb42cbe236e719540f880b2ee2de7717eee6d","scripts/perf-smoke.mjs":"329071c2de7c06eeb9739fdb0fa70a87a1953ecf21fdc1f26677b1f504d59de9","public/sw.js":"482c9366e78bfa21c122b30ffd327240f96822c6fe08932f461e233c63d2ae39","public/manifest.webmanifest":"66e900dafcc64ce8857db6a2553afa75c7dea6d08c7195f83dcf7d2bd1db83f4","scripts/zk682-public-canvas-capture.test.mjs":"3137c0f43e55258cbc509b60eff6d32dbcf2b07076e23548d1f4ce6c560beef9","scripts/zk682-certification-contract.test.mjs":"9d0fa57d16b887a77ea27ba67b5f1d6cc1a07c55b12ba2a0ca17eaf43cbc7ce8"};
          export const observerPins={"scripts/zk682-current-capture-phase/capture.mjs":"b0145491c40e4af6b2cf5113b5a93359c27c7f5b343a5727ca8709b5f0f9858a","scripts/zk682-current-capture-phase/capture.test.mjs":"ecff338aba7aa22a087a0454d48eaaa107a16d762695f510d4c5f8215bd61b74","scripts/zk682-current-capture-phase/producer-transform.mjs":"7dfb8e118691cbfe70fc3b079859568d3256ee2b7f1664cb3cdbaf80ac9926dc","scripts/zk682-current-capture-phase/producer-transform.test.mjs":"5642deff5ec46f3bb3d416e56637c637d9e661f9c72768de68060a60da2bcc5b","scripts/zk682-current-capture-phase/prepare.mjs":"18e58370cad556ea80b10dce238e45c9991188e70ef84b8d5c617db3922ced7b","scripts/zk682-current-capture-phase/prepare.test.mjs":"46c7af673f70fd34845204a2c071e8281784f3250e81bc141b52582471da3b4c"};
          export const namespace='artifacts/current-capture-host-phase-66';
          export const generatedPaths=Object.freeze(['scripts/zk682-current-capture-phase/generated-helper.mjs','e2e/zk682-current-capture-phase.generated.ts','playwright.current66-capture-phase.generated.config.ts']);
          export const artifactLimits=Object.freeze({"source/identity.json":65536,"source/generated-provenance.json":65536,"source/discovery.log":262144,"smoke/owned-command-receipt.json":65536,"smoke/stdout.log":262144,"smoke/stderr.log":262144,"run/owned-command-receipt.json":65536,"run/stdout.log":262144,"run/stderr.log":262144,"run/renderer-resource-growth.json":65536,"run/zk682-react-component-timing-cleanup.json":65536,"run/zk682-resource-growth-final.png":1048576,"run/zk682-canvas-capture-receipt.json":65536,"run/late-finalization-hold.json":65536,"smoke/late-finalization-hold.json":65536,"run/zk682-current-capture-phase-66-diagnostic.json":8192});
          export const hash=bytes=>createHash('sha256').update(bytes).digest('hex');
          const git=(root,...args)=>execFileSync('git',['-C',root,...args],{encoding:'utf8',timeout:10000,maxBuffer:65536,stdio:['ignore','pipe','pipe']}).trim();
          export function regular(path){assert.equal(realpathSync(path),resolve(path),'source ancestor symlink refused');const stat=lstatSync(path);assert.ok(stat.isFile()&&!stat.isSymbolicLink(),'regular file required');return stat;}
          export function jsonFile(path,cap=65536){const stat=regular(path);assert.ok(stat.size<=cap,'JSON cap');return JSON.parse(readFileSync(path,'utf8'));}
          export function verifyPins(appRoot,pins=targetPins){return Object.entries(pins).map(([path,pin])=>{assert.ok(!path.startsWith('/')&&!path.split('/').includes('..'));const file=resolve(appRoot,path);regular(file);const bytes=readFileSync(file);assert.equal(hash(bytes),pin,'source mismatch '+path);return {path,sha256:pin,bytes:bytes.length};});}
          export const appSourceCount=2358,appSourceDigest='e8e431fc48f600b5fa5730a64b3fca00ad4c10dac0f7b3c8e158b742cf1e174a';
          export function verifyAppSources(targetRoot){const text=execFileSync('git',['-C',targetRoot,'ls-files','-z','simgolf-lite/src'],{encoding:'utf8',timeout:10000,maxBuffer:1048576,stdio:['ignore','pipe','pipe']}),names=text.split('\0').filter(Boolean);assert.equal(names.length,appSourceCount,'full app source count');assert.equal(new Set(names).size,names.length);const rows=names.map(path=>{assert.ok(path.startsWith('simgolf-lite/src/')&&!path.split('/').includes('..'));const file=resolve(targetRoot,path);regular(file);return {path,sha256:hash(readFileSync(file))};});const digest=hash(JSON.stringify(rows));assert.equal(digest,appSourceDigest,'full app source digest');return {count:rows.length,digest};}
          export function assertRegisteredTarget(wanted){assert.equal(wanted,targetCandidate,'registered exact current66 target required');}
          export function childAliases(identity,supplied={}){assert.match(identity.targetCommit??'',/^[0-9a-f]{40}$/);assert.notEqual(identity.targetCommit,identity.driverCommit);const aliases={GITHUB_SHA:identity.targetCommit,VITE_COMMIT_SHA:identity.targetCommit,ZK682_EXPECTED_COMMIT:identity.targetCommit};for(const [key,value]of Object.entries(aliases))if(Object.hasOwn(supplied,key))assert.equal(supplied[key],value,'conflicting target alias '+key);return aliases;}
          export function verifyCheckouts(driverRoot,targetRoot,wanted=targetCandidate,driverExpected=process.env.DRIVER_SHA,{owned=[],allowArtifacts=false,postSettlement=false}={}){
            for(const value of [wanted,driverExpected])assert.match(value??'',/^[0-9a-f]{40}$/,'full commit required');
            for(const value of [driverRoot,targetRoot]){assert.doesNotMatch(value??'',/[\r\n\0]/);assert.equal(realpathSync(value),resolve(value),'checkout aliases refused');}
            driverRoot=resolve(driverRoot);targetRoot=resolve(targetRoot);assert.notEqual(driverRoot,targetRoot,'separate checkouts required');
            assert.equal(git(driverRoot,'rev-parse','--show-toplevel'),driverRoot,'actual driver root');assert.equal(git(targetRoot,'rev-parse','--show-toplevel'),targetRoot,'actual target root');
            const targetCommit=git(targetRoot,'rev-parse','HEAD'),driverCommit=git(driverRoot,'rev-parse','HEAD');assert.equal(targetCommit,wanted);assert.equal(driverCommit,driverExpected);assert.notEqual(targetCommit,driverCommit);git(targetRoot,'cat-file','-e',wanted+'^{commit}');
            git(driverRoot,'diff','--exit-code','HEAD','--');git(targetRoot,'diff','--exit-code','HEAD','--');
            const driverStatus=git(driverRoot,'status','--porcelain','--untracked-files=all');const nested=targetRoot===resolve(driverRoot,'target')?'?? target/':null;for(const row of driverStatus?driverStatus.split('\n'):[])assert.equal(row,nested,'unowned driver dirt');
            const allowed=new Set();for(const item of owned){const file=resolve(targetRoot,'simgolf-lite',item.path);verifyOwned(file,item);allowed.add('simgolf-lite/'+item.path);}
            if(allowArtifacts){const artifactRoot=resolve(targetRoot,'simgolf-lite',namespace);validateBounds(artifactRoot);for(const name of Object.keys(artifactLimits))if(lstatSync(resolve(artifactRoot,name),{throwIfNoEntry:false}))allowed.add('simgolf-lite/'+namespace+'/'+name);}
            if(postSettlement){const receipt=jsonFile(resolve(targetRoot,'simgolf-lite',namespace,'run/owned-command-receipt.json'));observedClosure(receipt);assert.equal(receipt.workerSeconds,1850);assert.equal(receipt.parentSeconds,1910);assert.deepEqual(receipt.command,directArguments());}
            const targetStatus=git(targetRoot,'status','--porcelain','--untracked-files=all');for(const row of targetStatus?targetStatus.split('\n'):[]){assert.ok(row.startsWith('?? '),'tracked target drift');if(!postSettlement)assert.ok(allowed.has(row.slice(3)),'unowned target dirt '+row);}
            return {targetCommit,driverCommit,targetRoot,driverRoot};
          }
