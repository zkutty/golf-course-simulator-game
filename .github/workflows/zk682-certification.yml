          export const artifactLimits=Object.freeze({"source/identity.json":65536,"source/generated-provenance.json":65536,"source/discovery.log":262144,"smoke/owned-command-receipt.json":65536,"smoke/stdout.log":262144,"smoke/stderr.log":262144,"run/owned-command-receipt.json":65536,"run/stdout.log":262144,"run/stderr.log":262144,"run/renderer-resource-growth.json":65536,"run/zk682-react-component-timing-cleanup.json":65536,"run/zk682-current-capture-phase-eebb-diagnostic.json":8192,"run/zk682-resource-growth-final.png":1048576,"run/zk682-canvas-capture-receipt.json":65536,"run/late-finalization-hold.json":65536,"smoke/late-finalization-hold.json":65536});
          export const hash=bytes=>createHash('sha256').update(bytes).digest('hex');
          const git=(root,...args)=>execFileSync('git',['-C',root,...args],{encoding:'utf8',timeout:10000,maxBuffer:65536,stdio:['ignore','pipe','pipe']}).trim();
          export function regular(path){assert.equal(realpathSync(path),resolve(path),'source ancestor symlink refused');const stat=lstatSync(path);assert.ok(stat.isFile()&&!stat.isSymbolicLink(),'regular file required');return stat;}
          export function jsonFile(path,cap=65536){const stat=regular(path);assert.ok(stat.size<=cap,'JSON cap');return JSON.parse(readFileSync(path,'utf8'));}
          export function verifyPins(appRoot,pins=targetPins){return Object.entries(pins).map(([path,pin])=>{assert.ok(!path.startsWith('/')&&!path.split('/').includes('..'));const file=resolve(appRoot,path);regular(file);const bytes=readFileSync(file);assert.equal(hash(bytes),pin,'source mismatch '+path);return {path,sha256:pin,bytes:bytes.length};});}
          export function assertRegisteredTarget(wanted){assert.equal(wanted,targetCandidate,'registered exact eebb target required');}
          export function childAliases(identity,supplied={}){assert.match(identity.targetCommit??'',/^[0-9a-f]{40}$/);assert.notEqual(identity.targetCommit,identity.driverCommit);const aliases={GITHUB_SHA:identity.targetCommit,VITE_COMMIT_SHA:identity.targetCommit,ZK682_EXPECTED_COMMIT:identity.targetCommit};for(const [key,value]of Object.entries(aliases))if(Object.hasOwn(supplied,key))assert.equal(supplied[key],value,'conflicting target alias '+key);return aliases;}
          export function verifyCheckouts(driverRoot,targetRoot,wanted=targetCandidate,driverExpected=process.env.DRIVER_SHA,{owned=[],allowArtifacts=false,postSettlement=false}={}){
            for(const value of [wanted,driverExpected])assert.match(value??'',/^[0-9a-f]{40}$/,'full commit required');
            for(const value of [driverRoot,targetRoot]){assert.doesNotMatch(value??'',/[\r\n\0]/);assert.equal(realpathSync(value),resolve(value),'checkout aliases refused');}
            driverRoot=resolve(driverRoot);targetRoot=resolve(targetRoot);assert.notEqual(driverRoot,targetRoot,'separate checkouts required');
            assert.equal(git(driverRoot,'rev-parse','--show-toplevel'),driverRoot,'actual driver root');assert.equal(git(targetRoot,'rev-parse','--show-toplevel'),targetRoot,'actual target root');
            const targetCommit=git(targetRoot,'rev-parse','HEAD'),driverCommit=git(driverRoot,'rev-parse','HEAD');assert.equal(targetCommit,wanted);assert.equal(driverCommit,driverExpected);assert.notEqual(targetCommit,driverCommit);git(targetRoot,'cat-file','-e',wanted+'^{commit}');
            git(driverRoot,'diff','--exit-code','HEAD','--');git(targetRoot,'diff','--exit-code','HEAD','--');
            const driverStatus=git(driverRoot,'status','--porcelain','--untracked-files=all');const nested=targetRoot===resolve(driverRoot,'target')?'?? target/':null;for(const row of driverStatus?driverStatus.split('\n'):[])assert.equal(row,nested,'unowned driver dirt');
            const allowed=new Set();for(const item of owned){const file=resolve(targetRoot,'simgolf-lite',item.path);verifyOwned(file,item);allowed.add('simgolf-lite/'+item.path);}
            if(allowArtifacts){const artifactRoot=resolve(targetRoot,'simgolf-lite',namespace);validateBounds(artifactRoot);for(const name of Object.keys(artifactLimits))if(lstatSync(resolve(artifactRoot,name),{throwIfNoEntry:false}))allowed.add('simgolf-lite/'+namespace+'/'+name);}
