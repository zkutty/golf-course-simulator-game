          export const hash=bytes=>createHash('sha256').update(bytes).digest('hex');
          export const diagnosticPins={"diagnostics/zk682-linux-renderer.diagnostic.ts": "c2857fd6549ac9b19c4748f56474ad18773bf32bb73c7d95b6f3dd8e0427e7e4", "scripts/zk682-linux-phase.mjs": "5cfe187372dd624c5807a9cb32f904f348e066230ec687c2000fe6b20eb7e5e3", "scripts/zk682-linux-cleanup-timing.mjs": "00c6aa6e08f6631708d3a1d80beed2f45de5da72bcfe8f065b6971ca39205767", "scripts/zk682-linux-capture.mjs": "ffc01e240447053a12f6fbcec2dfe21eae250b98c2a3150f2ca52a915be07422", "scripts/linux-diagnostic-supervisor.py": "7fa51db57c8c377262a16a712203721c5c53ba71344f2b53268350a9f76020d7", "playwright.zk682-linux-diagnostic.config.ts": "7f50ac4107be61109ae6c6ebef887c43f61351fecacfffd55db4b39de2fa85e8"};
