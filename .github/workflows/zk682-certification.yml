name: ZK-682 exact-SHA certification
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact unchanged f0a candidate SHA
        required: true
        type: string
      source_sha:
        description: Exact reviewed diagnostic source SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: zk1307-${{ inputs.source_sha }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  state-continuity:
    name: state-continuity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      WORKFLOW_PATH: .github/workflows/zk682-certification.yml
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - name: Checkout exact unchanged candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: candidate/simgolf-lite/package-lock.json
      - name: Verify source and candidate roles before setup
        timeout-minutes: 1
        run: node source/simgolf-lite/scripts/zk1307-state-continuity/host.mjs "$GITHUB_WORKSPACE/source" "$GITHUB_WORKSPACE/candidate" "$GITHUB_WORKSPACE/zk1307-output" --verify-only
      - name: Install exact locked candidate dependencies
        timeout-minutes: 2
        working-directory: candidate/simgolf-lite
        run: timeout --signal=TERM --kill-after=10s 110s npm ci
      - name: Install default pinned Chromium with dependencies
        timeout-minutes: 3
        working-directory: candidate/simgolf-lite
        run: timeout --signal=TERM --kill-after=10s 170s ./node_modules/.bin/playwright install --with-deps chromium
      - name: Run one owned state-continuity comparison
        timeout-minutes: 4
        run: node source/simgolf-lite/scripts/zk1307-state-continuity/host.mjs "$GITHUB_WORKSPACE/source" "$GITHUB_WORKSPACE/candidate" "$GITHUB_WORKSPACE/zk1307-output" --run
      - name: Upload exact comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zk1307-state-continuity-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
          path: |
            zk1307-output/trace/result.json
            zk1307-output/source-context.json
            zk1307-output/owner/owned-command-receipt.json
            zk1307-output/owner/stdout.log
            zk1307-output/owner/stderr.log
