          require(type(status["schemaVersion"]) is int and status["schemaVersion"] == 1 and status["purpose"] == "neutral-source-status" and status["phase"] == "before", "diagnostic status phase/schema")
          require(status["sourceSha"] == source and status["candidateSha"] == TARGET and type(status["runId"]) is int
                  and status["runId"] == int(run_id) and type(status["runAttempt"]) is int and status["runAttempt"] == 1, "diagnostic status role mismatch")
          require(status["rolesAndHeadsPassed"] is True and status["driverHead"] == source and status["targetHead"] == TARGET, "diagnostic status checkout roles")
          require(status["sourceQualified"] is False and status["outcome"] in ("FAIL", "HOLD") and error_record(status["firstFailure"]), "diagnostic failure status required")
          require(all(type(status[name]) is bool for name in ("pinsPassed", "historyComplete", "metadataOverflow")), "diagnostic status flags")
          require(status["statusFailure"] is None or error_record(status["statusFailure"]), "diagnostic status failure schema")
          require((status["outcome"] == "FAIL" and status["statusFailure"] is None and status["historyComplete"] and not status["metadataOverflow"])
                  or (status["outcome"] == "HOLD" and status["statusFailure"] is not None and not status["historyComplete"]), "diagnostic failure flags inconsistent")
          rows = status["changedPaths"]
          require(isinstance(rows, list) and len(rows) <= 128 and integer(status["collectedChangedPaths"], 0, 128)
                  and integer(status["omittedChangedPaths"], 0, 128), "diagnostic status path count")
          require(len(rows) + status["omittedChangedPaths"] == status["collectedChangedPaths"], "diagnostic status count reconciliation")
          require((not status["metadataOverflow"] and status["omittedChangedPaths"] == 0)
                  or (status["metadataOverflow"] and not rows), "diagnostic status omission flags")
          seen = set()
          for row in rows:
              require(isinstance(row, dict) and {"path", "changes", "hashOutcome"} <= set(row) <= {"path", "changes", "hashOutcome", "file", "hashError"}, "diagnostic changed row schema")
              name = row["path"]
              require(isinstance(name, str) and name and len(name.encode("utf-8")) <= 1024 and not name.startswith("/")
                      and all(part not in ("", ".", "..") for part in name.split("/")) and name not in seen, "diagnostic changed path invalid")
              seen.add(name)
              require(isinstance(row["changes"], list) and 1 <= len(row["changes"]) <= 2, "diagnostic changed status list")
              views = set()
              for change in row["changes"]:
                  require(isinstance(change, dict) and set(change) == {"view", "status"} and change["view"] in ("worktreeVsIndex", "indexVsHead")
                          and change["view"] not in views and change["status"] in ("A", "D", "M", "T", "U", "X", "B"), "diagnostic changed status invalid")
                  views.add(change["view"])
              if row["hashOutcome"] == "COMPLETE":
                  file = row.get("file")
                  require(isinstance(file, dict) and set(file) == {"bytes", "sha256"} and integer(file["bytes"], 0, 65536) and sha(file["sha256"])
                          and "hashError" not in row, "diagnostic changed hash invalid")
              else:
                  require(row["hashOutcome"] == "UNKNOWN" and "file" not in row and (row.get("hashError") is None or error_record(row["hashError"])), "diagnostic UNKNOWN hash invalid")
          require(status["outcome"] != "FAIL" or all(row["hashOutcome"] == "COMPLETE" for row in rows), "diagnostic complete history hash UNKNOWN")
          entry = {"path": STATUS, "bytes": len(data), "sha256": hashlib.sha256(data).hexdigest()}
          result = {"schemaVersion": 1, "purpose": "before-source-failure-diagnostic-only", "outcome": "BEFORE_SOURCE_FAILURE_DIAGNOSTIC_ONLY",
                    "sourceSha": source, "candidateSha": TARGET, "runId": int(run_id), "runAttempt": 1,
                    "workflowPath": WORKFLOW, "workflowRef": workflow_ref, "sourceRef": ref, "driverHead": source, "targetHead": TARGET,
                    "entries": [entry], "fileCountIncludingInventory": 2, "rawBytesExcludingInventory": len(data),
                    "rawCapBytes": 1073741824, "jsonCapBytes": 1048576, "sourceStatusCapBytes": 32768,
                    "beforeSourceOutcome": "failure", "resourceOutcome": "skipped", "stabilityOutcome": "skipped", "postSourceOutcome": "skipped",
                    "statusOutcome": status["outcome"], "sourceQualified": False, "numericalQualified": False, "certificationEligible": False,
                    "browserInvocation": "NOT_STARTED_BY_WORKFLOW_ORDER", "processClosure": "UNKNOWN; no universal native/descendant closure proved"}
          output_data = (json.dumps(result, separators=(",", ":")) + "\n").encode()
          require(len(output_data) <= 32768 and len(data) + len(output_data) <= 1073741824, "diagnostic inventory cap")
          require(identity(before) == identity(p.lstat()) and identity(root_before) == identity(raw.lstat()), "diagnostic prepublication drift")
          with open(raw / "heap-before-source-failure-inventory.json", "xb") as f:
              f.write(output_data); f.flush(); os.fsync(f.fileno())
          PY
