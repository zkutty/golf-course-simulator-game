name: ZK1262 SAVE final owner
on:
  push:
    branches:
      - codex/save-final-owner-b7fe
  workflow_dispatch:
    inputs:
      candidate_sha:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      root_descriptor_b64:
        required: true
        type: string
      root_descriptor_sha256:
        required: true
        type: string
permissions:
  contents: read
jobs:
  bootstrap-registration:
    if: ${{ github.repository == 'zkutty/golf-course-simulator-game' && github.event_name == 'push' && github.ref == 'refs/heads/codex/save-final-owner-b7fe' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Echo actual bootstrap workflow identity
        shell: bash
        run: |
          printf '%s\n' "event=$GITHUB_EVENT_NAME" "ref=$GITHUB_REF" "source_sha=$GITHUB_SHA" "workflow_ref=$GITHUB_WORKFLOW_REF" "run_id=$GITHUB_RUN_ID" "run_attempt=$GITHUB_RUN_ATTEMPT"
  save-final-owner:
    if: github.repository == 'zkutty/golf-course-simulator-game' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/save-final-owner-b7fe' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SAVE_CANDIDATE_INPUT: ${{ inputs.candidate_sha }}
      SAVE_SOURCE_INPUT: ${{ inputs.source_sha }}
      SAVE_DESCRIPTOR_B64: ${{ inputs.root_descriptor_b64 }}
      SAVE_DESCRIPTOR_SHA: ${{ inputs.root_descriptor_sha256 }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - name: Require exact dispatch identity and install inline supervisor
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re,stat
          from pathlib import Path
          expected={'GITHUB_REPOSITORY':'zkutty/golf-course-simulator-game','GITHUB_REPOSITORY_ID':'1120131901','GITHUB_EVENT_NAME':'workflow_dispatch','GITHUB_REF':'refs/heads/codex/save-final-owner-b7fe','GITHUB_JOB':'save-final-owner','GITHUB_RUN_ATTEMPT':'1','GITHUB_WORKFLOW_REF':'zkutty/golf-course-simulator-game/.github/workflows/zk1262-save-final-owner.yml@refs/heads/codex/save-final-owner-b7fe'}
          for key,value in expected.items():
              if os.environ.get(key)!=value:raise RuntimeError('dispatch identity: '+key)
          source=os.environ.get('GITHUB_SHA','')
          if not re.fullmatch('[0-9a-f]{40}',source) or source=='b7fe6c8be45ef6dbf4793cbd3714f2bc34d91025' or os.environ.get('SAVE_SOURCE_INPUT')!=source or os.environ.get('SAVE_CANDIDATE_INPUT')!='b7fe6c8be45ef6dbf4793cbd3714f2bc34d91025':raise RuntimeError('dispatch source/candidate')
          if not re.fullmatch('[1-9][0-9]{0,15}',os.environ.get('GITHUB_RUN_ID','')) or int(os.environ['GITHUB_RUN_ID'])>9007199254740991:raise RuntimeError('dispatch run')
          parent=Path(os.environ['RUNNER_TEMP'])
          if not parent.is_absolute() or str(parent)!=os.path.realpath(parent):raise RuntimeError('canonical supervisor parent')
          WORKFLOW_INLINE_SOURCE = "import base64,hashlib,importlib.util,json,math,os,re,selectors,signal,stat,subprocess,sys,time\nfrom pathlib import Path\nCANDIDATE='b7fe6c8be45ef6dbf4793cbd3714f2bc34d91025'\nCONTEXT_PIN={'bytes':31360,'sha256':'6595d12b96f562d7686dabca3dbc52c522789cc96d8a9054725995dec818a273'}\nDRIVER_PIN={'bytes':32439,'sha256':'fcc7e7229f9872c37f30c83f88fcaca1679477df2bf58602a3b0159d83fff4a6'}\nPHASE_PIN={'bytes':24432,'sha256':'74e475795537a49dafe054d2b345061dfa548731bdd3f9fba88e8b41485d60e8'}\nQUAL='SOURCE_QUALIFIED_LIVE_HOST_INSPECTOR_NOT_ROOT_PHYSICAL_OBSERVATION'\n\ndef need(ok,message):\n    if not ok:raise RuntimeError(message)\n\ndef pin(raw):return {'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}\n\ndef read(path,cap):\n    p=Path(path);need(p.is_absolute() and str(p)==os.path.realpath(p),'canonical file path')\n    need(str(p.parent)==os.path.realpath(p.parent),'canonical parent')\n    parent=os.open(p.parent,os.O_RDONLY|os.O_DIRECTORY|os.O_NOFOLLOW);fd=None\n    def state(s):return (s.st_dev,s.st_ino,s.st_mode,s.st_nlink,s.st_size,s.st_mtime_ns,s.st_ctime_ns)\n    def guard():\n        s=os.fstat(parent);t=p.parent.lstat();need((s.st_dev,s.st_ino)==(t.st_dev,t.st_ino),'read parent drift')\n    try:\n        guard();a=os.stat(p.name,dir_fd=parent,follow_symlinks=False)\n        need(stat.S_ISREG(a.st_mode) and a.st_nlink==1 and 0<a.st_size<=cap,'bounded single-link file')\n        fd=os.open(p.name,os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK,dir_fd=parent);b=os.fstat(fd)\n        need(state(a)==state(b),'read preopen drift');parts=[];n=0\n        while True:\n            data=os.read(fd,min(65536,cap-n+1))\n            if not data:break\n            n+=len(data);need(n<=cap,'read cap');parts.append(data)\n        guard();need(state(a)==state(os.fstat(fd))==state(os.stat(p.name,dir_fd=parent,follow_symlinks=False)) and n==a.st_size,'read drift')\n        raw=b''.join(parts);return raw,{**pin(raw),'dev':a.st_dev,'ino':a.st_ino}\n    finally:\n        try:\n            if fd is not None:os.close(fd)\n        finally:os.close(parent)\n\ndef wx(path,raw,cap=32768):\n    need(type(raw) is bytes and 0<len(raw)<=cap,'wx cap');p=Path(path)\n    need(p.is_absolute() and str(p)==os.path.realpath(p) and str(p.parent)==os.path.realpath(p.parent),'wx canonical path')\n    parent=os.open(p.parent,os.O_RDONLY|os.O_DIRECTORY|os.O_NOFOLLOW);fd=None\n    try:\n        captured=os.fstat(parent);need(stat.S_ISDIR(captured.st_mode),'wx parent type')\n        fd=os.open(p.name,os.O_RDWR|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600,dir_fd=parent);a=os.fstat(fd)\n        need(stat.S_ISREG(a.st_mode) and a.st_nlink==1,'wx physical type');offset=0\n        while offset<len(raw):\n            n=os.write(fd,raw[offset:]);need(n>0,'wx short write');offset+=n\n        os.fsync(fd);os.fsync(parent)\n        need(os.pread(fd,cap+1,0)==raw,'wx readback')\n        need((p.parent.lstat().st_dev,p.parent.lstat().st_ino)==(captured.st_dev,captured.st_ino),'wx parent drift')\n        actual,full=read(p,cap);need(actual==raw and (full['dev'],full['ino'])==(a.st_dev,a.st_ino),'wx path drift');return full\n    finally:\n        try:\n            if fd is not None:os.close(fd)\n        finally:os.close(parent)\n\ndef encoded(value):return (json.dumps(value,sort_keys=True,separators=(',',':'),allow_nan=False)+'\\n').encode()\n\ndef exact_module(path,expected,name):\n    raw,_=read(path,65536);need(pin(raw)==expected,'module full pin')\n    spec=importlib.util.spec_from_file_location(name,path);module=importlib.util.module_from_spec(spec)\n    sys.modules[name]=module;exec(compile(raw,str(path),'exec'),module.__dict__);return module\n\ndef locations(env):\n    source=env.get('GITHUB_SHA');need(type(source) is str and re.fullmatch('[0-9a-f]{40}',source) and source!=CANDIDATE,'source SHA')\n    work=Path(env['GITHUB_WORKSPACE']);temp=Path(env['RUNNER_TEMP'])\n    for p in (work,temp):need(p.is_absolute() and str(p)==os.path.realpath(p) and p.is_dir(),'canonical runtime parent')\n    prefix=str(temp/'zk1262-save-')+source\n    return {'driverRoot':str(work/'save-driver'),'targetRoot':str(work/'save-target'),'artifactRoot':prefix,\n      'contextRoot':str(temp/('zk1262-save-context-'+source)),'descriptor':str(temp/('zk1262-save-descriptor-'+source+'.json')),\n      'result':str(temp/('zk1262-save-context-result-'+source+'.json')),'binding':str(temp/('zk1262-save-workflow-binding-'+source+'.json')),\n      'stderr':str(temp/('zk1262-save-context-stderr-'+source+'.log')),'parentReceipt':str(temp/('zk1262-save-parent-receipt-'+source+'.json'))}\n\ndef decode_descriptor(text,expected):\n    need(type(text) is str and 0<len(text)<=65536 and text.isascii(),'descriptor base64 cap/ASCII')\n    need(type(expected) is str and re.fullmatch('[0-9a-f]{64}',expected),'independent descriptor SHA')\n    raw=base64.b64decode(text,validate=True);need(0<len(raw)<=49152 and base64.b64encode(raw).decode()==text,'canonical descriptor base64')\n    need(hashlib.sha256(raw).hexdigest()==expected,'independent descriptor full hash');return raw\n\ndef authority(c,d,env,loc):\n    c.descriptor(d);identity=c.environment_identity(d,env)\n    need(env.get('SAVE_CANDIDATE_INPUT')==CANDIDATE and env.get('SAVE_SOURCE_INPUT')==env['GITHUB_SHA'],'dispatch source/candidate')\n    for key in ('driverRoot','targetRoot','artifactRoot','contextRoot'):need(d[key]==loc[key],'descriptor canonical root: '+key)\n    need(d['sourceSHA']==env['GITHUB_SHA'],'descriptor source');return identity\n\ndef clamps(marker,now):\n    start=marker.get('start');need(type(start) in (int,float) and math.isfinite(start) and type(now) in (int,float) and math.isfinite(now),'finite monotonic boundary')\n    need(now>=start,'clock before original marker');term=start+2820;kill=start+2880\n    remaining=math.floor(term-now);grace=math.floor(kill-term)\n    need(remaining>0 and grace==60,'original marker launch deadline');return term,kill,remaining,grace\n\ndef argv(loc,path,sha,operation):\n    need(operation in ('run','publish','final'),'driver operation')\n    command = [sys.executable,loc['driverRoot']+'/scripts/zk1262-save-final-driver.py',operation,'--context',path,\n      '--context-sha256',sha,'--phase',loc['driverRoot']+'/scripts/zk1262-save-phase-adapter.py','--phase-sha256',PHASE_PIN['sha256']]\n    if operation=='run':command.append('--report-owner')\n    return command\n\ndef supervise(command,term,kill,clock=time.monotonic):\n    need(math.isfinite(term) and math.isfinite(kill) and clock()<term<=kill,'parent launch deadline')\n    started=clock();need(started<term,'parent launch deadline')\n    proc=None;sel=None;out=[bytearray(),bytearray()];sent=False;killed=False\n    r={'schema':1,'kind':'SAVE_WORKFLOW_ACTUAL_PARENT_RECEIPT_V1','argv':list(command),'startedMonotonic':started,\n      'absoluteTERM':term,'absoluteKILL':kill,'entered':False,'waited':False,'exitCode':None,'signal':None,\n      'timeoutPresent':False,'firstCausePresent':False,'firstCause':None,'secondary':[],'nativeDescendants':'UNKNOWN'}\n    def cause(value):\n        if not r['firstCausePresent']:r['firstCausePresent']=True;r['firstCause']=value\n        elif len(r['secondary'])<16:r['secondary'].append(value)\n        else:r['secondary'][-1]={'secondary':'TRUNCATED'}\n    def fault(stage,error):\n        try:name=type(error).__name__[:64]\n        except BaseException:name='UNKNOWN'\n        try:message=str(error)[:256]\n        except BaseException:message='UNFORMATABLE'\n        cause({'stage':stage,'error':name,'message':message})\n    def observed(code):\n        if code is None:return False\n        need(type(code) is int,'child exit observation')\n        if not r['waited']:\n            r['waited']=True\n            if code<0:r['signal']=-code\n            else:r['exitCode']=code\n            if code!=0:cause({'exitCode':r['exitCode'],'signal':r['signal']})\n        return True\n    def send(sig):\n        try:os.killpg(proc.pid,sig)\n        except BaseException as error:fault('signal',error)\n    try:\n        sel=selectors.DefaultSelector()\n        proc=subprocess.Popen(command,stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.PIPE,start_new_session=True)\n        r['entered']=True\n        for i,s in enumerate((proc.stdout,proc.stderr)):sel.register(s,selectors.EVENT_READ,i)\n        while True:\n            active=sel.get_map();done=observed(proc.poll())\n            if not active and done:break\n            now=clock()\n            if now>=term and not sent:sent=True;r['timeoutPresent']=True;cause('ABSOLUTE_PARENT_TERM');send(signal.SIGTERM)\n            if now>=kill and not killed:killed=True;send(signal.SIGKILL)\n            remaining=kill-clock()\n            if remaining<=0:\n                cause({'pipes':'UNKNOWN' if active else 'DRAINED','reap':'OBSERVED' if r['waited'] else 'UNKNOWN'})\n                break\n            if not active:\n                try:observed(proc.wait(timeout=min(.02,remaining)))\n                except subprocess.TimeoutExpired:pass\n                continue\n            events=sel.select(min(.02,remaining))\n            for key,_ in events:\n                if kill-clock()<=0:\n                    cause({'pipes':'UNKNOWN','deadline':'EXHAUSTED'});break\n                data=os.read(key.fileobj.fileno(),4096)\n                if not data:sel.unregister(key.fileobj);continue\n                need(sum(map(len,out))+len(data)<=262144,'parent aggregate stdio');out[key.data].extend(data)\n    except BaseException as error:fault('body',error)\n    finally:\n        if sel is not None:\n            try:sel.close()\n            except BaseException as error:fault('selector-close',error)\n        if proc is not None:\n            done=False\n            try:done=observed(proc.poll())\n            except BaseException as error:fault('poll',error)\n            if not done:send(signal.SIGKILL)\n            try:\n                remaining=kill-clock()\n                observed(proc.wait(timeout=min(1,remaining) if remaining>0 else 0))\n            except BaseException as error:fault('reap',error)\n            for s in (proc.stdout,proc.stderr):\n                try:s.close()\n                except BaseException as error:fault('pipe-close',error)\n        try:\n            r['endedMonotonic']=clock();r['late']=r['endedMonotonic']>kill\n            if r['late']:cause('LATE_PARENT_COMPLETION')\n        except BaseException as error:\n            r['endedMonotonic']=None;r['late']=True;fault('completion-clock',error)\n        r['output']=[]\n        for x in out:\n            try:r['output'].append(pin(bytes(x)))\n            except BaseException as error:\n                fault('output-pin',error);r['output'].append({'bytes':len(x),'sha256':'UNKNOWN'})\n    return r,bytes(out[0]),bytes(out[1])\n\ndef binding_guard(c,driver,phase,d,loc,result,inspector):\n    need(type(result) is dict and set(result)=={'finalPath','finalPin','handoffPin','qualification','ownerLaunched'},'context result fields')\n    need(result['qualification']==QUAL and result['ownerLaunched'] is False,'context result qualification')\n    need(result['finalPath']==loc['contextRoot']+'/final-context.json','actual final context path')\n    c.pin(result['finalPin'],32768,True);c.pin(result['handoffPin'],32768,True)\n    root=Path(loc['contextRoot']);need(set(p.name for p in root.iterdir())==set(c.ROLES),'exact context roles')\n    initialraw,ip=inspector.read(root/'initial-context.json',32768)\n    finalraw,fp=inspector.read(result['finalPath'],32768)\n    handraw,hp=inspector.read(root/'context-handoff.json',32768)\n    need(c.same(fp,result['finalPin']) and c.same(hp,result['handoffPin']),'actual context returned full pins')\n    need(sum(x['bytes'] for x in (ip,fp,hp))<=98304,'context aggregate')\n    initial=c.strict(initialraw,32768);final=c.strict(finalraw,32768);hand=c.strict(handraw,32768)\n    need(set(final)==set(initial)|{'prelaunchBoundaryPin'} and c.same({k:final[k] for k in initial},initial),'final only boundary pin')\n    need(c.same(final['sourcePins'],d['sourcePins']) and final['admissionSHA256']==os.environ['SAVE_DESCRIPTOR_SHA'],'context descriptor/source binding')\n    need(c.same(hand['initial'],{'path':str(root/'initial-context.json'),**ip}) and c.same(hand['final'],{'path':result['finalPath'],**fp}),'context handoff full pins')\n    need(hand.get('schema')==1 and hand.get('kind')=='SAVE_CONTEXT_SOURCE_QUALIFIED_HANDOFF_V1','handoff kind')\n    need(hand['descriptorSHA256']==final['admissionSHA256'] and c.same(hand['identity'],final['identity']) and hand['qualification']==QUAL\n      and hand['ownerLaunched'] is False and hand['runtimeAcceptance'] is False and hand['nativeDescendants']=='UNKNOWN','handoff authority qualification')\n    marker,bp,_=driver.live_boundary(phase,final)\n    need(c.same(bp,final['prelaunchBoundaryPin']) and c.same(bp,hand['seal']),'original actual seal pin');inspector.check()\n    return {'schema':1,'finalPath':result['finalPath'],'finalPin':fp,'qualification':QUAL},final,marker\n\ndef load_bound(c,loc,inspector):\n    raw,_=inspector.read(loc['descriptor'],49152);need(hashlib.sha256(raw).hexdigest()==os.environ['SAVE_DESCRIPTOR_SHA'],'retained descriptor hash')\n    d=c.strict(raw);authority(c,d,dict(os.environ),loc)\n    driver=exact_module(loc['driverRoot']+'/scripts/zk1262-save-final-driver.py',DRIVER_PIN,'save_workflow_driver')\n    phase=exact_module(loc['driverRoot']+'/scripts/zk1262-save-phase-adapter.py',PHASE_PIN,'save_workflow_phase')\n    return d,driver,phase\n\ndef ingress(c,loc):\n    started=time.monotonic();inspector=c.Inspector(clock=lambda:time.monotonic());inspector.end=started+120\n    raw=decode_descriptor(os.environ.get('SAVE_DESCRIPTOR_B64'),os.environ.get('SAVE_DESCRIPTOR_SHA'))\n    d=c.strict(raw,49152);authority(c,d,dict(os.environ),loc);wx(loc['descriptor'],raw,49152)\n    driver=exact_module(loc['driverRoot']+'/scripts/zk1262-save-final-driver.py',DRIVER_PIN,'save_workflow_driver')\n    phase=exact_module(loc['driverRoot']+'/scripts/zk1262-save-phase-adapter.py',PHASE_PIN,'save_workflow_phase')\n    command=[sys.executable,loc['driverRoot']+'/scripts/zk1262-save-context.py','--descriptor',loc['descriptor'],'--descriptor-sha256',os.environ['SAVE_DESCRIPTOR_SHA']]\n    receipt,stdout,stderr=supervise(command,started+120,started+125)\n    wx(loc['result'],stdout if stdout else b'null\\n',32768)\n    if stderr:wx(loc['stderr'],stderr,262144)\n    need(receipt['waited'] is True and receipt['exitCode']==0 and receipt['signal'] is None and not receipt['timeoutPresent'] and not receipt['late'],'context actual successful exit required')\n    inspector.check();result=c.strict(stdout,32768)\n    bound,_,marker=binding_guard(c,driver,phase,d,loc,result,inspector);inspector.check()\n    need(inspector.clock()<marker['start']+2820,'late original marker binding')\n    wx(loc['binding'],encoded(bound));inspector.check()\n    with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf8') as f:f.write('bound=true\\n')\n    return 0\n\ndef operation(c,loc,op):\n    inspector=c.Inspector();d,driver,phase=load_bound(c,loc,inspector)\n    rraw,_=inspector.read(loc['result'],32768);result=c.strict(rraw,32768)\n    braw,_=inspector.read(loc['binding'],32768);binding=c.strict(braw,32768)\n    current,ctx,marker=binding_guard(c,driver,phase,d,loc,result,inspector);need(c.same(current,binding),'retained binding drift')\n    command=argv(loc,binding['finalPath'],binding['finalPin']['sha256'],op)\n    if op=='run':\n        term,kill,remaining,grace=clamps(marker,time.monotonic())\n        actual=['timeout','--signal=TERM','--kill-after='+str(grace)+'s',str(remaining)+'s']+command\n        receipt,stdout,stderr=supervise(actual,term,kill);receipt['identity']=ctx['identity'];receipt['driverArgv']=command\n        receipt['contextPin']=binding['finalPin'];receipt['descriptorSHA256']=ctx['admissionSHA256']\n        wx(loc['parentReceip