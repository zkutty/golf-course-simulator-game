name: Release candidate certification

on:
  workflow_dispatch:
  push:
    tags: ["v*-rc.*"]

defaults:
  run:
    working-directory: simgolf-lite

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: simgolf-lite/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Static and unit gates
        run: npm run lint && npx tsc -b && npm run test:ci
      - name: Reducer fuzz
        run: npm run test:fuzz
      - name: Full browser regression
        run: npm run test:e2e -- --grep-invert "ZK-813|ZK-1205 exact 144-row real-pointer placement matrix$|ZK-674 keeps (parkland|links|desert) atlas generations atomic through tier and zoom reversals$" --workers=1
      - name: Chrome and WebKit clean-profile path
        run: npm run test:release:browsers -- --grep-invert "ZK-813" --project=chrome-stable --project=webkit-safari-proxy --workers=1
      - name: Firefox headed clean-profile path
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run --auto-servernum npm run test:release:browsers -- --grep-invert "ZK-813" --project=firefox --workers=1 --headed
      - name: Long-form balance matrix
        run: npm run test:balance
      - name: Deterministic simulation soak
        run: npm run test:soak
      - name: Canonical 36-hole and cross-biome renderer performance
        run: |
          PERF_FIXTURE=m27 PERF_THEME=parkland npm run test:perf
          PERF_THEME=links npm run test:perf
          PERF_THEME=desert npm run test:perf
      - name: Production PWA subpath/offline smoke
        run: npm run test:pwa
      - name: Build and audit exact Pages artifact
        run: VITE_BASE=/ npm run build && npm run release:audit
      - name: Upload M28 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m28-release-candidate-evidence
          path: |
            simgolf-lite/artifacts/m28
            simgolf-lite/playwright-report
            simgolf-lite/test-results
          if-no-files-found: ignore
          retention-days: 90

  zk1205-pointer-matrix:
    name: ZK-1205 pointer matrix (rows ${{ matrix.start }}-${{ matrix.end }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { start: 0, end: 5, count: 6, integrated: "1", skip_persistence: "0" }
          - { start: 6, end: 23, count: 18, integrated: "0", skip_persistence: "1" }
          - { start: 24, end: 41, count: 18, integrated: "0", skip_persistence: "1" }
          - { start: 42, end: 59, count: 18, integrated: "0", skip_persistence: "1" }
          - { start: 60, end: 77, count: 18, integrated: "0", skip_persistence: "1" }
          - { start: 78, end: 95, count: 18, integrated: "0", skip_persistence: "1" }
          - { start: 96, end: 113, count: 18, integrated: "0", skip_persistence: "1" }
          - { start: 114, end: 131, count: 18, integrated: "0", skip_persistence: "1" }
          - { start: 132, end: 143, count: 12, integrated: "0", skip_persistence: "1" }
    env:
      ZK1205_START_ROW: ${{ matrix.start }}
      ZK1205_MAX_ROWS: ${{ matrix.count }}
      ZK1205_RUN_INTEGRATED: ${{ matrix.integrated }}
      ZK1205_SKIP_PERSISTENCE: ${{ matrix.skip_persistence }}
      ZK1205_EVIDENCE_DIR: artifacts/zk1205-${{ matrix.start }}-${{ matrix.end }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: simgolf-lite/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run deterministic pointer-matrix chunk
        run: >-
          npm run test:e2e -- e2e/zk1205-pointer-placement-matrix.e2e.ts
          --workers=1
          --trace retain-on-failure-and-retries
      - name: Upload pointer-matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc-zk1205-${{ matrix.start }}-${{ matrix.end }}
          path: |
            simgolf-lite/artifacts/zk1205-${{ matrix.start }}-${{ matrix.end }}
            simgolf-lite/playwright-report
            simgolf-lite/test-results
          if-no-files-found: ignore
          retention-days: 90

  zk674-biome-zoom-cache:
    name: ZK-674 ${{ matrix.theme }} atlas/zoom certification
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        theme: [parkland, links, desert]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: simgolf-lite/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run biome-specific atlas and zoom certification
        run: >-
          npm run test:e2e -- e2e/zk674-biome-zoom-cache.e2e.ts
          --grep 'ZK-674 keeps ${{ matrix.theme }} atlas generations atomic through tier and zoom reversals$'
          --workers=1
          --trace retain-on-failure-and-retries
      - name: Upload biome certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc-zk674-${{ matrix.theme }}
          path: |
            simgolf-lite/playwright-report
            simgolf-lite/test-results
          if-no-files-found: ignore
          retention-days: 90

  m65-certify:
    name: M65 evidence and cross-engine certification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: simgolf-lite/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: M65 evidence-bound Chromium certification
        run: npm run test:cert:m65
      - name: Upload verified M65 report
        uses: actions/upload-artifact@v4
        with:
          name: m65-machine-certification
          path: simgolf-lite/artifacts/m65/certification-report.json
          if-no-files-found: error
          retention-days: 90
      - name: ZK-813 Firefox headed certification
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run --auto-servernum npm run test:release:browsers -- --grep "ZK-813" --project=firefox --workers=1 --headed
      - name: ZK-813 WebKit certification
        run: npm run test:release:browsers -- --grep "ZK-813" --project=webkit-safari-proxy --workers=1
