name: ZK-682 end-only heap GC diagnostics
run-name: End-GC diagnostics for ${{ github.sha }}

on:
  push:
    branches: [codex/end-heap-gc-diagnostics]

permissions:
  contents: read

defaults:
  run:
    working-directory: simgolf-lite

jobs:
  heap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ZK682_EXPECTED_COMMIT: ${{ github.sha }}
      ZK682_APPLICATION_BASELINE: 5f7d7caf682c33b939e6865483f07068ab2f4823
      ZK682_DIAGNOSTIC_BASELINE: 5f7d7caf682c33b939e6865483f07068ab2f4823
    steps:
      - name: Checkout immutable diagnostic source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Initialize runner diagnostic directory
        run: printf 'ZK682_DIAGNOSTIC_ROOT=%s/zk682-end-heap-gc-diagnostics\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Verify unchanged application and dependency inputs
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          [[ "$ZK682_EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD > /tmp/heap-diagnostic-source-commit.txt
          git rev-parse HEAD^{tree} > /tmp/heap-diagnostic-source-tree.txt
          sha256sum simgolf-lite/package-lock.json | cut -d " " -f 1 > /tmp/heap-diagnostic-lock-sha.txt
          git diff --exit-code "$ZK682_DIAGNOSTIC_BASELINE" HEAD -- simgolf-lite/src simgolf-lite/package.json simgolf-lite/package-lock.json simgolf-lite/vite.config.ts
          while IFS= read -r changed; do
            case "$changed" in
              .github/workflows/zk682-end-heap-gc-diagnostics.yml|simgolf-lite/e2e/zk682-stability.e2e.ts) ;;
              *) echo "Unexpected diagnostic change: $changed"; exit 1 ;;
            esac
          done < <(git diff --name-only "$ZK682_DIAGNOSTIC_BASELINE" HEAD)
          mkdir -p "$ZK682_DIAGNOSTIC_ROOT/reports/stability"
          date -u +%FT%TZ > "$ZK682_DIAGNOSTIC_ROOT/started-at.txt"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: simgolf-lite/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build original application inputs
        run: GITHUB_SHA="$ZK682_EXPECTED_COMMIT" npm run build
      - name: Collect single end-only heap observation
        id: stability
        continue-on-error: true
        if: always()
        env:
          ZK682_END_GC_DIAGNOSTICS_DIR: ${{ runner.temp }}/zk682-end-heap-gc-diagnostics/observation
        run: |
          set +e
          GITHUB_SHA="$ZK682_EXPECTED_COMMIT" npm run test:stability -- --output-dir "$ZK682_DIAGNOSTIC_ROOT/reports/stability" --expected-commit "$ZK682_EXPECTED_COMMIT" 2>&1 | tee "$ZK682_DIAGNOSTIC_ROOT/stability-producer.log"
          result=${PIPESTATUS[0]}
          printf '%s\n' "$result" > "$ZK682_DIAGNOSTIC_ROOT/stability-exit-code.txt"
          exit "$result"
      - name: Validate separate diagnostic completeness
        id: diagnostics
        continue-on-error: true
        if: always()
        run: |
          node --input-type=module <<'JS'
          import fs from "node:fs";
          import path from "node:path";
          import assert from "node:assert/strict";
          const root = process.env.ZK682_DIAGNOSTIC_ROOT;
          const read = (...parts) => JSON.parse(fs.readFileSync(path.join(root, ...parts), "utf8"));
          const file = path.join(root, "observation", "end-heap-gc-diagnostics.json");
          const stat = fs.statSync(file);
          assert.ok(stat.size > 0 && stat.size <= 128 * 1024);
          const receipt = JSON.parse(fs.readFileSync(file, "utf8"));
          const started = Date.parse(fs.readFileSync(path.join(root, "started-at.txt"), "utf8").trim());
          assert.ok(Date.parse(receipt.startedAt) >= started);
          assert.ok(Date.parse(receipt.completedAt) >= Date.parse(receipt.startedAt));
          assert.equal(receipt.schemaVersion, 1);
          assert.equal(receipt.diagnosticOnly, true);
          assert.equal(receipt.certificationEligible, false);
          assert.equal(receipt.singleObservation, true);
          assert.equal(receipt.laterProducerMeasurementsPerturbed, true);
          assert.equal(receipt.candidateCommit, process.env.ZK682_EXPECTED_COMMIT);
          assert.equal(receipt.applicationBaseline, process.env.ZK682_APPLICATION_BASELINE);
          assert.equal(receipt.complete, true);
          assert.equal(receipt.errorCount, 0);
          assert.deepEqual(receipt.errors, []);
          assert.equal(receipt.originalEnd.cycle, 12);
          assert.equal(receipt.requestedDelayMs, 120);
          const actions = ["before-extra-gc", "first-extra-gc", "immediate-after-first-gc", "diagnostic-120ms-delay", "after-120ms-delay", "second-extra-gc", "immediate-after-second-gc"];
          assert.deepEqual(receipt.actions.map(a => a.name), actions);
          for (let i = 0; i < receipt.actions.length; i++) {
            const a = receipt.actions[i];
            assert.equal(a.error, null);
            assert.ok(Number.isFinite(a.startedMs) && Number.isFinite(a.completedMs) && a.completedMs >= a.startedMs);
            if (i) assert.ok(a.startedMs >= receipt.actions[i - 1].completedMs);
          }
          assert.ok(receipt.actions[3].completedMs - receipt.actions[3].startedMs >= 115);
          assert.deepEqual(receipt.readings.map(r => r.name), [actions[0], actions[2], actions[4], actions[6]]);
          assert.ok(receipt.readings.every(r => Number.isFinite(r.usedSize) && r.usedSize > 0 && Number.isFinite(r.totalSize) && r.totalSize >= r.usedSize));
          const original = read("reports", "stability", "save-load-resource-stability.json");
          assert.equal(original.candidateCommit, receipt.candidateCommit);
          assert.deepEqual(original.samples.at(-1), receipt.originalEnd);
          assert.equal(original.passed, receipt.originalReportPassed);
          assert.deepEqual(original.errors.slice(0, 8), receipt.originalReportErrors);
          assert.ok(!fs.existsSync(`${file}.tmp`));
          assert.ok(!fs.readFileSync(path.join(root, "stability-producer.log"), "utf8").includes("[zk682-end-gc-diagnostics]"));
          console.log("Diagnostic artifacts complete; original producer outcomes remain separate.");
          JS
      - name: Record diagnostic provenance and producer outcomes
        if: always()
        env:
          STABILITY_OUTCOME: ${{ steps.stability.outcome }}
          DIAGNOSTIC_OUTCOME: ${{ steps.diagnostics.outcome }}
        run: |
          node --input-type=module <<'JS'
          import fs from "node:fs";
          import path from "node:path";
          const root = process.env.ZK682_DIAGNOSTIC_ROOT;
          fs.mkdirSync(root, { recursive: true });
          const readExit = (name) => {
            const file = path.join(root, `${name}-exit-code.txt`);
            return fs.existsSync(file) ? Number(fs.readFileSync(file, "utf8").trim()) : null;
          };
          fs.writeFileSync(path.join(root, "provenance.json"), JSON.stringify({
            diagnosticOnly: true,
            certificationEligible: false,
            candidateCommit: process.env.ZK682_EXPECTED_COMMIT,
            diagnosticCommit: "${{ github.sha }}",
            observedDiagnosticCommit: fs.readFileSync("/tmp/heap-diagnostic-source-commit.txt", "utf8").trim(),
            diagnosticTree: fs.readFileSync("/tmp/heap-diagnostic-source-tree.txt", "utf8").trim(),
            lockSha256: fs.readFileSync("/tmp/heap-diagnostic-lock-sha.txt", "utf8").trim(),
            initialSourceClean: true,
            applicationBaseline: process.env.ZK682_DIAGNOSTIC_BASELINE,
            platform: process.platform,
            architecture: process.arch,
            nodeVersion: process.version,
            stability: { outcome: process.env.STABILITY_OUTCOME, exitCode: readExit("stability") },
            diagnostics: { outcome: process.env.DIAGNOSTIC_OUTCOME },
            limitation: "End-only extra GC is diagnostic-only and perturbs later long-session evidence; original save/load JSON is preserved before the observation."
          }, null, 2));
          JS
      - name: Preserve separate diagnostics and original report outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zk682-end-heap-gc-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/zk682-end-heap-gc-diagnostics
          if-no-files-found: error
          retention-days: 30
      - name: Preserve failing producer exit status
        if: always()
        env:
          STABILITY_OUTCOME: ${{ steps.stability.outcome }}
          DIAGNOSTIC_OUTCOME: ${{ steps.diagnostics.outcome }}
        run: |
          test "$STABILITY_OUTCOME" = success
          test "$DIAGNOSTIC_OUTCOME" = success
