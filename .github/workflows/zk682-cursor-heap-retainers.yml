name: ZK-682 cursor heap retainers
run-name: Heap diagnostics for ${{ github.sha }}

on:
  push:
    branches: [codex/cursor-heap-retainers]

permissions:
  contents: read

defaults:
  run:
    working-directory: simgolf-lite

jobs:
  heap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ZK682_EXPECTED_COMMIT: ${{ github.sha }}
      ZK682_DIAGNOSTIC_BASELINE: 6688ad2655dfcbabb9ec669c59c8a037a734824f
    steps:
      - name: Checkout immutable diagnostic source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Initialize runner diagnostic directory
        run: printf 'ZK682_DIAGNOSTIC_ROOT=%s/zk682-cursor-heap-retainers\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Verify unchanged application and dependency inputs
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          [[ "$ZK682_EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD > /tmp/heap-diagnostic-source-commit.txt
          git rev-parse HEAD^{tree} > /tmp/heap-diagnostic-source-tree.txt
          sha256sum simgolf-lite/package-lock.json | cut -d " " -f 1 > /tmp/heap-diagnostic-lock-sha.txt
          git diff --exit-code "$ZK682_DIAGNOSTIC_BASELINE" HEAD -- simgolf-lite/src simgolf-lite/package.json simgolf-lite/package-lock.json simgolf-lite/vite.config.ts
          while IFS= read -r changed; do
            case "$changed" in
              .github/workflows/zk682-cursor-heap-retainers.yml|simgolf-lite/e2e/zk682-stability.e2e.ts) ;;
              *) echo "Unexpected diagnostic change: $changed"; exit 1 ;;
            esac
          done < <(git diff --name-only "$ZK682_DIAGNOSTIC_BASELINE" HEAD)
          mkdir -p "$ZK682_DIAGNOSTIC_ROOT/reports/stability"
          date -u +%FT%TZ > "$ZK682_DIAGNOSTIC_ROOT/started-at.txt"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: simgolf-lite/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build original application inputs
        run: GITHUB_SHA="$ZK682_EXPECTED_COMMIT" npm run build
      - name: Collect bounded save-load heap evidence
        id: stability
        continue-on-error: true
        if: always()
        env:
          ZK682_DIAGNOSTICS_DIR: ${{ runner.temp }}/zk682-cursor-heap-retainers/heap
        run: |
          set +e
          GITHUB_SHA="$ZK682_EXPECTED_COMMIT" npm run test:stability -- --output-dir "$ZK682_DIAGNOSTIC_ROOT/reports/stability" --expected-commit "$ZK682_EXPECTED_COMMIT" 2>&1 | tee "$ZK682_DIAGNOSTIC_ROOT/stability-producer.log"
          result=${PIPESTATUS[0]}
          printf '%s\n' "$result" > "$ZK682_DIAGNOSTIC_ROOT/stability-exit-code.txt"
          exit "$result"
      - name: Validate separate diagnostic completeness
        id: diagnostics
        continue-on-error: true
        if: always()
        run: |
          node --input-type=module <<'JS'
          import fs from "node:fs";
          import path from "node:path";
          import assert from "node:assert/strict";
          const root = process.env.ZK682_DIAGNOSTIC_ROOT;
          const read = (...parts) => JSON.parse(fs.readFileSync(path.join(root, ...parts), "utf8"));
          const heap = read("heap", "heap-diagnostics.json");
          assert.equal(heap.diagnosticOnly, true);
          assert.equal(heap.candidateCommit, process.env.ZK682_EXPECTED_COMMIT);
          assert.equal(heap.complete, true);
          assert.equal(heap.errorCount, 0);
          assert.ok(Date.parse(heap.startedAt) >= Date.parse(fs.readFileSync(path.join(root, "started-at.txt"), "utf8").trim()));
          assert.ok(!fs.readFileSync(path.join(root, "stability-producer.log"), "utf8").includes("[zk682-heap-diagnostics]"));
          assert.equal(heap.samples.length, 13);
          assert.deepEqual(heap.samples.map(sample => sample.cycle), Array.from({length: 13}, (_, index) => index));
          assert.equal(heap.limits.snapshots, 2);
          assert.equal(heap.captures.length, 2);
          assert.deepEqual(heap.captures.map(({cycle, reasons}) => ({cycle, reasons})), [
            {cycle: 0, reasons: ["baseline"]}, {cycle: 12, reasons: ["end"]},
          ]);
          for (const capture of heap.captures) {
            assert.equal(capture.complete, true);
            assert.equal(capture.error, null);
            assert.equal(path.basename(capture.file), capture.file);
            const bytes = fs.statSync(path.join(root, "heap", capture.file)).size;
            assert.equal(bytes, capture.bytesWritten);
            assert.ok(bytes > 0 && bytes <= 256 * 1024 * 1024);
          }
          console.log("Diagnostic artifacts complete; original producer outcomes remain separate.");
          JS
      - name: Record diagnostic provenance and producer outcomes
        if: always()
        env:
          STABILITY_OUTCOME: ${{ steps.stability.outcome }}
          DIAGNOSTIC_OUTCOME: ${{ steps.diagnostics.outcome }}
        run: |
          node --input-type=module <<'JS'
          import fs from "node:fs";
          import path from "node:path";
          const root = process.env.ZK682_DIAGNOSTIC_ROOT;
          fs.mkdirSync(root, { recursive: true });
          const readExit = (name) => {
            const file = path.join(root, `${name}-exit-code.txt`);
            return fs.existsSync(file) ? Number(fs.readFileSync(file, "utf8").trim()) : null;
          };
          fs.writeFileSync(path.join(root, "provenance.json"), JSON.stringify({
            diagnosticOnly: true,
            certificationEligible: false,
            candidateCommit: process.env.ZK682_EXPECTED_COMMIT,
            diagnosticCommit: "${{ github.sha }}",
            observedDiagnosticCommit: fs.readFileSync("/tmp/heap-diagnostic-source-commit.txt", "utf8").trim(),
            diagnosticTree: fs.readFileSync("/tmp/heap-diagnostic-source-tree.txt", "utf8").trim(),
            lockSha256: fs.readFileSync("/tmp/heap-diagnostic-lock-sha.txt", "utf8").trim(),
            initialSourceClean: true,
            applicationBaseline: process.env.ZK682_DIAGNOSTIC_BASELINE,
            platform: process.platform,
            architecture: process.arch,
            nodeVersion: process.version,
            stability: { outcome: process.env.STABILITY_OUTCOME, exitCode: readExit("stability") },
            diagnostics: { outcome: process.env.DIAGNOSTIC_OUTCOME },
            limitation: "Profiling and heap snapshots perturb execution; use uninstrumented exact-SHA certification for acceptance."
          }, null, 2));
          JS
      - name: Preserve separate diagnostics and original report outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zk682-cursor-heap-retainers-${{ github.sha }}
          path: ${{ runner.temp }}/zk682-cursor-heap-retainers
          if-no-files-found: error
          retention-days: 30
      - name: Preserve failing producer exit status
        if: always()
        env:
          STABILITY_OUTCOME: ${{ steps.stability.outcome }}
          DIAGNOSTIC_OUTCOME: ${{ steps.diagnostics.outcome }}
        run: |
          test "$(cat "$ZK682_DIAGNOSTIC_ROOT/stability-exit-code.txt")" = 0
          test "$STABILITY_OUTCOME" = success
          test "$DIAGNOSTIC_OUTCOME" = success
