name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

defaults:
  run:
    working-directory: simgolf-lite

jobs:
  ci:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    # The full Playwright regression can exceed 30 minutes on GitHub's shared
    # runners, in addition to setup, typecheck, lint, and unit tests.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: simgolf-lite/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Lint (zero errors)
        run: npm run lint

      - name: Test
        run: npm run test:ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Pixi renderer ownership regression
        run: npx playwright test e2e/pixi-peer-ownership.e2e.ts --workers=1 --retries=0 --output=pixi-peer-ownership-test-results
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: pixi-peer-ownership-report

      - name: Upload Pixi renderer ownership report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixi-peer-ownership-e2e-report
          path: |
            simgolf-lite/pixi-peer-ownership-report
            simgolf-lite/pixi-peer-ownership-test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: M65 machine certification
        run: npm run test:cert:m65

      - name: Upload verified M65 report
        uses: actions/upload-artifact@v4
        with:
          name: m65-machine-certification
          path: simgolf-lite/artifacts/m65/certification-report.json
          if-no-files-found: error
          retention-days: 90

      - name: Golden-path E2E
        run: npm run test:e2e:golden

      - name: Upload Golden-path E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-path-e2e-report
          path: |
            simgolf-lite/playwright-report
            simgolf-lite/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Vision Player Pro narrative regression
        run: npx playwright test e2e/zk741-player-career-vision.e2e.ts --workers=1 --retries=0 --output=vision-player-career-test-results --reporter=github,html,json
        env:
          VISION_CAREER_EVIDENCE_DIR: vision-player-career-evidence
          PLAYWRIGHT_HTML_OUTPUT_DIR: vision-player-career-report
          PLAYWRIGHT_JSON_OUTPUT_NAME: vision-player-career-report/results.json

      - name: Upload Vision Player Pro narrative report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vision-player-career-e2e-report
          path: |
            simgolf-lite/vision-player-career-report
            simgolf-lite/vision-player-career-test-results
            simgolf-lite/vision-player-career-evidence
          if-no-files-found: ignore
          retention-days: 14

      - name: Build
        run: npm run build
        env:
          # No VITE_SENTRY_ENVIRONMENT override here: this artifact is reused
          # unmodified by both the staging and production deploy jobs below,
          # so the environment tag is resolved from hostname at runtime instead.
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_CF_WEB_ANALYTICS_TOKEN: ${{ vars.VITE_CF_WEB_ANALYTICS_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: simgolf-lite/dist
          retention-days: 7

  deploy-playtest:
    name: Deploy tested artifact to Cloudflare playtest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cloudflare-playtest
      cancel-in-progress: true
    environment:
      name: playtest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Download tested build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: simgolf-lite/dist

      - name: Deploy static assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: simgolf-lite
          wranglerVersion: "4.113.0"
          command: deploy --env staging

  deploy-production:
    name: Deploy tested artifact to Cloudflare production
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    environment:
      name: cloudflare
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Download tested build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: simgolf-lite/dist

      - name: Deploy static assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: simgolf-lite
          wranglerVersion: "4.113.0"
          command: deploy --env=""
