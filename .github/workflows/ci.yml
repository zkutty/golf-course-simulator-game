name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: simgolf-lite

jobs:
  ci:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    # The full Playwright regression takes ~14 minutes on GitHub's shared
    # runners, in addition to setup, typecheck, lint, and unit tests.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: simgolf-lite/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Lint (zero errors)
        run: npm run lint

      - name: Test
        run: npm run test:ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Golden-path E2E
        run: npm run test:e2e

      - name: Build
        run: npm run build
        env:
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: playtest
          VITE_CF_WEB_ANALYTICS_TOKEN: ${{ vars.VITE_CF_WEB_ANALYTICS_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: simgolf-lite/dist
          retention-days: 7

  deploy-playtest:
    name: Deploy tested artifact to Cloudflare
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: playtest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Download tested build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: simgolf-lite/dist

      - name: Deploy static assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: simgolf-lite
          wranglerVersion: "4.113.0"
          command: deploy
