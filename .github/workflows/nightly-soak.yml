    timeout-minutes: 20
    env:
      CI: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: simgolf-lite/package-lock.json
      - run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Run isolated M27 architecture certifications
        run: >-
          npm run test:e2e -- e2e/m27-architecture-release.e2e.ts
          --grep 'M27 reports architecture for a live 36-hole, two-course estate$|M27 report remains usable with pseudo locale, text scaling, reduced motion, and color-safe terrain$'
          | tee m27-architecture.log
      - name: Upload M27 architecture report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-m27-architecture
          path: |
            simgolf-lite/m27-architecture.log
            simgolf-lite/playwright-report
            simgolf-lite/test-results
            simgolf-lite/artifacts/m27-architect-report.png
