  m35_pointer_profile:
    name: M35 pointer-drag browser main-thread profile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI: 1
      ZK987_CAPTURE_BROWSER_PROFILE: 1
      PLAYWRIGHT_JSON_OUTPUT_FILE: nightly-evidence/m35-pointer-profile-results.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: simgolf-lite/package-lock.json
      - run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Run retry-disabled M35 pointer-drag diagnostic
        run: |
          set +e
          npm run test:e2e -- e2e/m35-surface-authoring.e2e.ts \
            --grep 'M35 click spline and post-commit node/tangent editing stay atomic$' \
            --retries=0 \
            --trace=on \
            --reporter=github,html,json | tee m35-pointer-profile.log
          test_status=${PIPESTATUS[0]}
          set -e
          mkdir -p nightly-evidence
          printf '%s\n' "$test_status" > nightly-evidence/m35-pointer-profile-exit-code.txt
      - name: Build and validate M35 pointer-profile evidence
        if: always()
        env:
          ZK987_RESULTS: nightly-evidence/m35-pointer-profile-results.json
          ZK987_MANIFEST: nightly-evidence/m35-pointer-profile-manifest.json
          ZK987_EXIT_CODE: nightly-evidence/m35-pointer-profile-exit-code.txt
          ZK987_TITLE: M35 click spline and post-commit node/tangent editing stay atomic
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const resultsPath = process.env.ZK987_RESULTS;
          const manifestPath = process.env.ZK987_MANIFEST;
          const exitCodePath = process.env.ZK987_EXIT_CODE;
          if (!fs.existsSync(resultsPath)) throw new Error(`ZK-987 missing Playwright JSON results: ${resultsPath}`);
          if (!fs.existsSync(exitCodePath)) throw new Error(`ZK-987 missing diagnostic exit-code record: ${exitCodePath}`);
          const report = JSON.parse(fs.readFileSync(resultsPath, "utf8"));
          const specs = [];
          const visit = (suite) => {
            for (const spec of suite.specs || []) specs.push(spec);
            for (const child of suite.suites || []) visit(child);
          };
          for (const suite of report.suites || []) visit(suite);
          const matching = specs.filter((spec) => spec.title === process.env.ZK987_TITLE);
          if (matching.length !== 1 || matching[0].tests.length !== 1 || matching[0].tests[0].results.length !== 1) {
            throw new Error("ZK-987 diagnostic must report exactly one retry-disabled M35 pointer-drag attempt.");
          }
          const result = matching[0].tests[0].results[0];
          if (result.retry !== 0) throw new Error(`ZK-987 diagnostic retry must be 0, received ${result.retry}.`);
          const trace = (result.attachments || []).find((attachment) => attachment.name === "trace");
          const profile = (result.attachments || []).find((attachment) => attachment.name === "browser-main-thread.cpuprofile");
          if (!trace?.path || !fs.existsSync(trace.path)) throw new Error("ZK-987 diagnostic trace is missing.");
          if (!profile?.path || !fs.existsSync(profile.path)) throw new Error("ZK-987 Chromium page-main-thread profile is missing.");
          const parsedProfile = JSON.parse(fs.readFileSync(profile.path, "utf8"));
          if (!Array.isArray(parsedProfile.nodes) || parsedProfile.nodes.length === 0) {
            throw new Error("ZK-987 Chromium page-main-thread profile is not parseable.");
          }
          const manifest = {
            schema: "zk987-m35-browser-main-thread-profile/v1",
            sha: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            generatedAt: new Date().toISOString(),
            title: matching[0].title,
            retry: result.retry,
            outcome: result.status,
            startedAt: result.startTime,
            tracePath: trace.path,
            browserMainThreadCpuProfilePath: profile.path,
            profiler: "Chromium page-target CDP Profiler",
          };
          fs.mkdirSync(path.dirname(manifestPath), { recursive: true });
          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
          const testExitCode = Number(fs.readFileSync(exitCodePath, "utf8").trim());
          if (!Number.isInteger(testExitCode) || testExitCode < 0) {
            throw new Error("ZK-987 diagnostic exit-code record is invalid.");
          }
          process.exit(testExitCode);
          NODE
      - name: Upload M35 pointer-profile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-m35-pointer-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            simgolf-lite/m35-pointer-profile.log
            simgolf-lite/nightly-evidence/m35-pointer-profile-results.json
            simgolf-lite/nightly-evidence/m35-pointer-profile-manifest.json
            simgolf-lite/nightly-evidence/m35-pointer-profile-exit-code.txt
            simgolf-lite/test-results
          if-no-files-found: error
          retention-days: 14

  nightly_qa_result:
    name: Nightly QA result
    if: always()
    needs:
      - browser
      - m27_architecture
      - m43_m45_reporting
      - m28_terrain_stroke
      - m30_pace_history
      - m35_authoring
      - m36_player_pro
      - m45_bug_reporter
      - zk571_matrix
      - zk765_visual
      - renderer_performance
      - simulation_soak
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every nightly QA gate
        working-directory: .
        env:
          BROWSER_RESULT: ${{ needs.browser.result }}
          M27_ARCHITECTURE_RESULT: ${{ needs.m27_architecture.result }}
          M43_M45_REPORTING_RESULT: ${{ needs.m43_m45_reporting.result }}
          M28_TERRAIN_STROKE_RESULT: ${{ needs.m28_terrain_stroke.result }}
          M30_PACE_HISTORY_RESULT: ${{ needs.m30_pace_history.result }}
          M35_AUTHORING_RESULT: ${{ needs.m35_authoring.result }}
          M36_PLAYER_PRO_RESULT: ${{ needs.m36_player_pro.result }}
          M45_BUG_REPORTER_RESULT: ${{ needs.m45_bug_reporter.result }}
          ZK571_MATRIX_RESULT: ${{ needs.zk571_matrix.result }}
          ZK765_VISUAL_RESULT: ${{ needs.zk765_visual.result }}
          RENDERER_PERFORMANCE_RESULT: ${{ needs.renderer_performance.result }}
          SIMULATION_SOAK_RESULT: ${{ needs.simulation_soak.result }}
        run: |
          echo "Browser suite result: $BROWSER_RESULT"
          echo "M27 architecture result: $M27_ARCHITECTURE_RESULT"
          echo "M43/M45 reporting result: $M43_M45_REPORTING_RESULT"
          echo "M28 terrain stroke result: $M28_TERRAIN_STROKE_RESULT"
          echo "M30 pace-history result: $M30_PACE_HISTORY_RESULT"
          echo "M35 landscape-authoring result: $M35_AUTHORING_RESULT"
          echo "M36 Player Pro result: $M36_PLAYER_PRO_RESULT"
          echo "M45 bug-reporter result: $M45_BUG_REPORTER_RESULT"
          echo "ZK-571 matrix result: $ZK571_MATRIX_RESULT"
          echo "ZK-765 visual reference result: $ZK765_VISUAL_RESULT"
          echo "Renderer performance result: $RENDERER_PERFORMANCE_RESULT"
          echo "Simulation soak result: $SIMULATION_SOAK_RESULT"
          if [[ "$BROWSER_RESULT" != "success" ]]; then
            exit 1
          fi
          if [[ "$M27_ARCHITECTURE_RESULT" != "success" ]]; then
            exit 1
          fi
          if [[ "$M43_M45_REPORTING_RESULT" != "success" ]]; then
            exit 1
          fi
          if [[ "$M28_TERRAIN_STROKE_RESULT" != "success" ]]; then
            exit 1
          fi
          if [[ "$M30_PACE_HISTORY_RESULT" != "success" ]]; then
            exit 1
          fi
          if [[ "$M35_AUTHORING_RESULT" != "success" ]]; then
            exit 1
          fi
          if [[ "$M36_PLAYER_PRO_RESULT" != "success" ]]; then
            exit 1
          fi
          if [[ "$M45_BUG_REPORTER_RESULT" != "success" ]]; then
            exit 1
          fi
          if [[ "$ZK571_MATRIX_RESULT" != "success" ]]; then
            exit 1
          fi
          if [[ "$ZK765_VISUAL_RESULT" != "success" ]]; then
            exit 1
          fi
          if [[ "$RENDERER_PERFORMANCE_RESULT" != "success" ]]; then
            exit 1
          fi
          if [[ "$SIMULATION_SOAK_RESULT" != "success" ]]; then
            exit 1
          fi
