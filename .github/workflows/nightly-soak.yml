  m35_authoring:
    name: M35 landscape-authoring certifications
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 1
      PLAYWRIGHT_JSON_OUTPUT_FILE: nightly-evidence/m35-authoring-results.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: simgolf-lite/package-lock.json
      - run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Run isolated M35 landscape-authoring certifications
        run: >-
          npm run test:e2e -- e2e/m35-landscape-details.e2e.ts e2e/m35-surface-authoring.e2e.ts e2e/m35-water-grading.e2e.ts
          --grep 'single-cell bunker and natural detail render as organic landscape$|M35 click spline and post-commit node/tangent editing stay atomic$|painting water automatically commits a flat excavated basin$'
          --trace retain-on-failure-and-retries
          --reporter=github,html,json | tee m35-authoring.log
      - name: Build M35 retry-evidence manifest
        if: always()
        env:
          ZK987_RESULTS: nightly-evidence/m35-authoring-results.json
          ZK987_MANIFEST: nightly-evidence/m35-authoring-manifest.json
          ZK987_TITLES: >-
            ["single-cell bunker and natural detail render as organic landscape","M35 click spline and post-commit node/tangent editing stay atomic","painting water automatically commits a flat excavated basin"]
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const resultsPath = process.env.ZK987_RESULTS;
          const manifestPath = process.env.ZK987_MANIFEST;
          const selectedTitles = JSON.parse(process.env.ZK987_TITLES);
          if (!fs.existsSync(resultsPath)) throw new Error(`ZK-987 missing Playwright JSON results: ${resultsPath}`);
          const report = JSON.parse(fs.readFileSync(resultsPath, "utf8"));
          const specs = [];
          const visit = (suite) => {
            for (const spec of suite.specs || []) specs.push(spec);
            for (const child of suite.suites || []) visit(child);
          };
          for (const suite of report.suites || []) visit(suite);
          const attempts = specs.flatMap((spec) => spec.tests.flatMap((test) => test.results.map((result) => {
            const trace = (result.attachments || []).find((attachment) => attachment.name === "trace");
            return {
              title: spec.title,
              retry: result.retry,
              outcome: result.status,
              startedAt: result.startTime,
              tracePath: trace && trace.path,
            };
          }))).filter((attempt) => selectedTitles.includes(attempt.title));
          const manifest = {
            schema: "zk987-nightly-retry-evidence/v1",
            sha: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            generatedAt: new Date().toISOString(),
            selectedTitles,
            attempts,
          };
          for (const title of selectedTitles) {
            if (!attempts.some((attempt) => attempt.title === title && attempt.retry === 0)) {
              throw new Error(`ZK-987 missing original M35 attempt for ${title}.`);
            }
          }
          for (const attempt of attempts) {
            const traceRequired = attempt.retry > 0 || attempt.outcome !== "passed";
            if (traceRequired && (!attempt.tracePath || !fs.existsSync(attempt.tracePath))) {
              throw new Error(`ZK-987 missing retained trace for ${attempt.title} retry ${attempt.retry} (${attempt.outcome}).`);
            }
          }
          fs.mkdirSync(path.dirname(manifestPath), { recursive: true });
          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
      - name: Upload M35 retry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-m35-retry-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            simgolf-lite/nightly-evidence/m35-authoring-results.json
            simgolf-lite/nightly-evidence/m35-authoring-manifest.json
            simgolf-lite/test-results
          if-no-files-found: error
          retention-days: 14
      - name: Upload M35 landscape-authoring report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-m35-authoring
          path: |
            simgolf-lite/m35-authoring.log
            simgolf-lite/playwright-report
            simgolf-lite/test-results
            simgolf-lite/artifacts
          if-no-files-found: ignore
          retention-days: 14

